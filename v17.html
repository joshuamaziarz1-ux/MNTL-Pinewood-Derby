<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Manager v17</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1522;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#0b1522}
</style>
</head>
<body>
<iframe id="shell" title="MNLT Derby Manager v17" src="v16.html?v=17-1304"></iframe>
<script>
(function(){
'use strict';
const shell=document.getElementById('shell');
function deepestAppWin(){
  try{
    let w=shell.contentWindow;
    for(let i=0;i<8;i++){
      const f=w.document.querySelector('iframe');
      if(!f||!f.contentWindow)break;
      w=f.contentWindow;
    }
    return w;
  }catch(e){return null}
}
function launchPreRace(){
  window.open('v17-prerace.html?v=17-1304','mnltPreRace','width=1500,height=900');
}
function patch(){
  const w=deepestAppWin();if(!w)return;
  const d=w.document;
  ['preRaceBtn','traditionalPreRaceBtn','openPreRace'].forEach(id=>{
    const b=d.getElementById(id);
    if(b&&!b.dataset.v17PreRace){
      b.onclick=launchPreRace;
      b.dataset.v17PreRace='1';
    }
  });
  const v=d.querySelector('.version');if(v)v.textContent='v17';
  d.title='MNLT Derby Manager v17';
}
shell.addEventListener('load',()=>{setTimeout(patch,250);setTimeout(patch,900)});
setInterval(patch,500);
})();
</script>
</body>
</html>
