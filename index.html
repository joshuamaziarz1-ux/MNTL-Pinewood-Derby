<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0d1724;color:#eef4fb}header{background:#14253a;padding:18px 24px;border-bottom:3px solid #d8a63d}h1{margin:0;font-size:26px}.sub{color:#aebdcd;margin-top:4px}.tabs{display:flex;gap:8px;padding:14px 18px;background:#101d2d;overflow:auto}.tabs button,.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer}.tabs button{background:#22354b;color:#dce8f5}.tabs button.active,.btn.primary{background:#d8a63d;color:#111}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:#152438;border:1px solid #2b4058;border-radius:12px;padding:18px;margin-bottom:16px}h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,select{width:100%;padding:12px;border-radius:7px;border:1px solid #41566e;background:#0e1b2a;color:white;margin:5px 0 10px}.row{display:flex;gap:10px}.row>*{flex:1}.racer,.heat{background:#0f1c2b;border:1px solid #30465f;border-radius:9px;padding:12px;margin:8px 0}.muted{color:#9fb0c2}.hidden{display:none}.lane{display:grid;grid-template-columns:70px 1fr 100px;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #2a3c51}.lane:last-child{border:0}.place{font-weight:700;font-size:18px}.danger{background:#8f3540;color:white}.secondary{background:#2b4058;color:white}.big{font-size:20px;padding:15px 20px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #30465f}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.lane{grid-template-columns:55px 1fr 80px}}
</style>
</head>
<body>
<header><h1>MNLT DERBY MANAGER</h1><div class="sub">Race Day Core • 4-Lane Pinewood Derby</div></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap">
<section id="racers" class="page"><div class="grid"><div class="panel"><h2>Add Racer</h2><label>Racer name</label><input id="name" placeholder="Racer name"><label>Car name</label><input id="car" placeholder="Car name (optional)"><label>Division</label><select id="division"><option>Traditional</option><option>Modified</option></select><button class="btn primary big" onclick="addRacer()">Add Racer</button></div><div class="panel"><h2>Racers <span id="count"></span></h2><div id="racerList"></div></div></div></section>
<section id="heats" class="page hidden"><div class="panel"><h2>Heat Schedule</h2><p class="muted">Generates balanced 4-lane qualifying heats. Racers rotate through lanes; empty lanes become BYEs.</p><button class="btn primary big" onclick="generateHeats()">Generate / Regenerate Heats</button><div id="heatList"></div></div></section>
<section id="race" class="page hidden"><div class="panel"><h2>Run Race</h2><div id="raceBox"></div></div></section>
<section id="standings" class="page hidden"><div class="panel"><h2>Standings</h2><div id="standingsBox"></div></div></section>
<section id="data" class="page hidden"><div class="panel"><h2>Race Data</h2><p class="muted">Race data autosaves on this device.</p><div class="row"><button class="btn secondary" onclick="exportData()">Export Backup</button><button class="btn danger" onclick="resetAll()">Reset Everything</button></div></div></section>
</main>
<script>
const KEY='mnltDerbyV1';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{racers:[],heats:[],current:0};
const pages=['racers','heats','race','standings','data'];const labels=['Racers','Schedule','Race','Standings','Data'];
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function show(p){pages.forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==p));[...tabs.children].forEach((b,i)=>b.classList.toggle('active',pages[i]===p));if(p==='race')renderRace();if(p==='standings')renderStandings()}
pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=labels[i];b.onclick=()=>show(p);tabs.appendChild(b)});show('racers');
function addRacer(){let n=name.value.trim();if(!n)return alert('Enter a racer name.');S.racers.push({id:Date.now()+Math.random(),name:n,car:car.value.trim(),division:division.value});name.value='';car.value='';S.heats=[];S.current=0;save()}
function removeRacer(id){if(confirm('Remove this racer?')){S.racers=S.racers.filter(r=>r.id!==id);S.heats=[];S.current=0;save()}}
function render(){count.textContent='('+S.racers.length+')';racerList.innerHTML=S.racers.length?'':'<p class="muted">No racers yet.</p>';S.racers.forEach((r,i)=>racerList.innerHTML+=`<div class="racer"><b>#${i+1} ${esc(r.name)}</b> ${r.car?'— '+esc(r.car):''}<div class="muted">${r.division}</div><button class="btn danger" onclick="removeRacer(${r.id})">Remove</button></div>`);renderHeatList()}
function generateHeats(){if(S.racers.length<2)return alert('Add at least 2 racers first.');let rs=[...S.racers];let rounds=Math.min(4,Math.max(1,Math.ceil(rs.length/4)));let heats=[];for(let rd=0;rd<rounds;rd++){let rotated=rs.map((_,i)=>rs[(i+rd)%rs.length]);for(let i=0;i<rotated.length;i+=4){let group=rotated.slice(i,i+4);while(group.length<4)group.push(null);group=group.map((_,lane)=>group[(lane+rd)%4]);heats.push({id:heats.length+1,round:rd+1,lanes:group.map(r=>r&&r.id),result:null})}}S.heats=heats;S.current=0;save();show('heats')}
function renderHeatList(){if(!window.heatList)return;heatList.innerHTML=S.heats.length?'':'<p class="muted">No schedule generated.</p>';S.heats.forEach(h=>{let names=h.lanes.map(id=>{let r=S.racers.find(x=>x.id===id);return r?r.name:'BYE'}).join(' • ');heatList.innerHTML+=`<div class="heat"><b>Heat ${h.id}</b> <span class="muted">Round ${h.round}</span><br>${esc(names)} ${h.result?'✓':''}</div>`})}
function renderRace(){if(!S.heats.length){raceBox.innerHTML='<p>No heats yet. Generate the schedule first.</p>';return}let h=S.heats[S.current];if(!h){raceBox.innerHTML='<h2>Qualifying Complete</h2><button class="btn primary" onclick="show(\'standings\')">View Standings</button>';return}let ranked=h.result?[...h.result]:h.lanes.filter(Boolean);raceBox.innerHTML=`<h3>Heat ${h.id} of ${S.heats.length}</h3><p class="muted">Click racers in finishing order: 1st → 2nd → 3rd → 4th.</p><div id="finish"></div><div class="row"><button class="btn secondary" onclick="undoPick()">Undo</button><button class="btn primary" onclick="saveHeat()">Save Heat & Next</button></div>`;window.picks=[];h.lanes.forEach((id,l)=>{let r=S.racers.find(x=>x.id===id);finish.innerHTML+=`<div class="lane"><b>Lane ${l+1}</b><span>${r?esc(r.name):'<span class="muted">BYE</span>'}</span>${r?`<button class="btn secondary" id="pick${id}" onclick="pick(${id})">Finish</button>`:''}</div>`})}
function pick(id){if(picks.includes(id))return;picks.push(id);document.getElementById('pick'+id).textContent=ordinal(picks.length)}function undoPick(){let id=picks.pop();if(id)document.getElementById('pick'+id).textContent='Finish'}
function saveHeat(){let h=S.heats[S.current],active=h.lanes.filter(Boolean);if(picks.length!==active.length)return alert('Enter the finish order for every racer in this heat.');h.result=[...picks];S.current++;save();renderRace()}
function renderStandings(){let score={};S.racers.forEach(r=>score[r.id]={r,pts:0,wins:0,races:0});S.heats.forEach(h=>{if(!h.result)return;h.result.forEach((id,i)=>{score[id].races++;score[id].pts+=Math.max(0,4-i);if(i===0)score[id].wins++})});let a=Object.values(score).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);standingsBox.innerHTML='<table><tr><th>Place</th><th>Racer</th><th>Races</th><th>Wins</th><th>Points</th></tr>'+a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.r.name)}</td><td>${x.races}</td><td>${x.wins}</td><td>${x.pts}</td></tr>`).join('')+'</table>'}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='MNLT-Derby-Backup.json';a.click()}
function resetAll(){if(confirm('Erase ALL racers, heats and results on this device?')){S={racers:[],heats:[],current:0};save();show('racers')}}function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':'4th'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();
</script>
</body></html>
