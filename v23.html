<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Manager v23</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1522;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#0b1522}
#mnltVersion{position:fixed;left:8px;bottom:5px;z-index:2147483647;color:#778a9d;font:12px Arial,sans-serif;pointer-events:none;background:#0b1522;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<iframe id="shell" title="MNLT Derby Manager v23" src="v22.html?v=23-1550"></iframe>
<div id="mnltVersion">v23</div>
<script>
(function(){
'use strict';
const shell=document.getElementById('shell');
const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos';
let selected={trad:null,mod:null};
let objectUrls=[];

function appWin(){try{let w=shell.contentWindow;for(let i=0;i<20;i++){const f=w.document.querySelector('iframe');if(!f||!f.contentWindow)break;w=f.contentWindow}return w}catch(e){return null}}
function appDoc(){const w=appWin();return w?w.document:null}
function show(id){const w=appWin();if(w&&typeof w.show==='function')w.show(id)}
function readState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function getPhoto(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function putPhoto(key,blob){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function compressImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.86))}finally{URL.revokeObjectURL(url)}}
function clearUrls(){objectUrls.forEach(u=>URL.revokeObjectURL(u));objectUrls=[]}

function approvedRegs(type){const s=readState();if(!s||!Array.isArray(s.registrations))return[];const insField=type==='trad'?'tradInspection':'modInspection';return s.registrations.filter(r=>r.status!=='Withdrawn'&&r[insField]&&r[insField].approved&&(type==='trad'?(r.division==='Traditional'||r.division==='Both'):(r.division==='Modified'||r.division==='Both'))).sort((a,b)=>((type==='trad'?a.tradNo:a.modNo)||9999)-((type==='trad'?b.tradNo:b.modNo)||9999)||String(a.name).localeCompare(String(b.name)))}
function numFor(r,type){return type==='trad'?String(r.tradNo||''):('M'+String(r.modNo||''))}
function carNameFor(r,type){return type==='trad'?(r.tradCar||'Unnamed Car'):(r.modCar||'Unnamed Car')}
function photoFlag(r,type){const x=r[type==='trad'?'tradInspection':'modInspection']||{};return !!x.photoSaved}
function cardField(type){return type==='trad'?'tradRaceCard':'modRaceCard'}
function cardSaved(r,type){const x=r[cardField(type)]||{};return !!x.saved}
function mutateReg(id,type,body){const w=appWin();if(!w)return;const f=cardField(type);const code=`mutate(()=>{const r=S.registrations.find(x=>x.id===${Number(id)});if(r){if(!r.${f})r.${f}={saved:false,savedAt:''};${body}}})`;try{w.eval(code)}catch(e){console.error(e)}}
function markCardSaved(r,type){const f=cardField(type);mutateReg(r.id,type,`r.${f}.saved=true;r.${f}.savedAt=new Date().toISOString();`);setTimeout(()=>renderCards(type,'Card saved.'),60)}
function markPhotoSaved(r,type){const insp=type==='trad'?'tradInspection':'modInspection';const w=appWin();if(!w)return;const code=`mutate(()=>{const r=S.registrations.find(x=>x.id===${Number(r.id)});if(r){if(!r.${insp})r.${insp}={};r.${insp}.photoSaved=true;if(!r.${cardField(type)})r.${cardField(type)}={};r.${cardField(type)}.saved=false;r.${cardField(type)}.savedAt='';}})`;try{w.eval(code)}catch(e){console.error(e)}}

function installStyle(d){if(d.getElementById('mnltV23Style'))return;const s=d.createElement('style');s.id='mnltV23Style';s.textContent=`
.v23Nav{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0e1c2c;border:1px solid #30465f;border-radius:10px;padding:10px 12px;margin-bottom:14px}.v23NavBtns{display:flex;gap:8px;flex-wrap:wrap}.v23Crumb{color:#aab9c8;font-weight:700}
.v23Header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.v23Header h2{margin:0 0 5px;font-size:30px}.v23Selector{min-width:280px}.v23Selector label{display:block;color:#aab9c8;font-weight:800;margin-bottom:6px}.v23Selector select{width:100%;font-size:17px}
.v23Summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}.v23Sum{background:#0e1c2c;border:1px solid #30465f;border-radius:10px;padding:12px;text-align:center}.v23Num{font-size:28px;font-weight:900}.v23Lab{color:#aab9c8;font-weight:700}
.v23Workspace{display:grid;grid-template-columns:minmax(300px,430px) minmax(280px,1fr);gap:20px;align-items:start}.v23CardWrap{display:flex;justify-content:center}.v23Card{width:min(100%,390px);aspect-ratio:5/7;background:linear-gradient(145deg,#101d2d 0%,#0b1522 58%,#18263a 100%);border:3px solid #d8a63d;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 18px 38px rgba(0,0,0,.32)}
.v23Check{height:26px;background:repeating-conic-gradient(#e5e8ec 0 25%,#1a2635 0 50%) 0/26px 26px;border-bottom:3px solid #d8a63d}.v23Hero{height:58%;position:relative;background:radial-gradient(circle at 50% 48%,#20334d 0,#122036 48%,#0b1522 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}.v23Hero:after{content:'';position:absolute;inset:auto -18% 8% -18%;height:8px;background:#d8a63d;transform:rotate(-5deg);opacity:.8}.v23Hero img{width:100%;height:100%;object-fit:cover;display:block}.v23Placeholder{padding:30px;text-align:center;color:#8fa3b8;font-weight:900;font-size:18px}.v23Number{position:absolute;top:16px;left:16px;z-index:2;background:#d8a63d;color:#0b1522;font-size:38px;font-weight:1000;line-height:1;padding:10px 13px;border-radius:10px;box-shadow:0 5px 16px rgba(0,0,0,.35)}
.v23Info{padding:17px 19px 16px}.v23CarTitle{font-size:27px;font-weight:1000;color:#f0c55d;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v23Racer{font-size:22px;font-weight:900;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v23Meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:14px}.v23Division{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#aab9c8;font-weight:900}.v23Weight{font-size:14px;color:#d6e0ea;font-weight:800}.v23Event{position:absolute;bottom:7px;left:19px;right:19px;text-align:center;color:#6f859a;font-size:11px;letter-spacing:1.4px;font-weight:900;text-transform:uppercase}
.v23Controls{background:#0e1c2c;border:1px solid #30465f;border-radius:12px;padding:16px}.v23Status{padding:11px 12px;border-radius:9px;margin-bottom:14px;font-weight:900}.v23Status.ready{background:#10271d;color:#9ee7af;border:1px solid #3e7f55}.v23Status.need{background:#2b2413;color:#f0c55d;border:1px solid #745d23}.v23Actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.v23Actions .btn{min-height:46px}.v23Save{grid-column:1/-1;font-size:18px!important;background:#2e8050!important}.v23Save[disabled]{opacity:.45;cursor:not-allowed}.v23File{display:none!important}.v23Msg{min-height:22px;margin-top:10px;color:#9ee7af;font-weight:800}.v23Cats{margin-top:16px}.v23Cat{background:#0e1c2c;border:1px solid #30465f;border-radius:10px;padding:12px;margin-top:9px}.v23CatTitle{font-weight:900;margin-bottom:7px}.v23Pills{display:flex;gap:7px;flex-wrap:wrap}.v23Pill{border:1px solid #3a526d;border-radius:999px;padding:6px 9px;background:#13243a;font-size:13px;font-weight:800;color:#d6e0ea}.v23Pill button{all:unset;cursor:pointer}.v23Empty{color:#7f93a7;font-style:italic}.v23NeedPhoto{color:#f0c55d}.v23Saved{color:#9ee7af}
@media(max-width:850px){.v23Workspace{grid-template-columns:1fr}.v23Selector{min-width:0;width:100%}.v23Summary{grid-template-columns:1fr}.v23Actions{grid-template-columns:1fr}.v23Save{grid-column:auto}.v23Nav{align-items:flex-start;flex-direction:column}}
`;d.head.appendChild(s)}

function createPage(d,type){const id=type==='trad'?'traditionalRaceCardsV23':'modifiedRaceCardsV23';if(d.getElementById(id))return;const p=d.createElement('section');p.id=id;p.className='page hidden';p.innerHTML=`<div class="v23Nav"><div class="v23NavBtns"><button class="btn v23Back">← Back</button><button class="btn v23Home">Home</button></div><div class="v23Crumb">${type==='trad'?'Home > Race Day > Traditional > Race Cards':'Home > Race Day > Modified > Race Cards'}</div></div><div class="panel"><div id="${id}Body"></div></div>`;d.getElementById('appMain').appendChild(p);p.querySelector('.v23Back').onclick=()=>show(type==='trad'?'traditionalRaceHub':'modifiedRaceHub');p.querySelector('.v23Home').onclick=()=>show('home')}

function enableSteps(d){const trad=d.querySelectorAll('#traditionalRaceHub .mnltStep');if(trad.length>3){const s=trad[3];s.classList.remove('mnltDisabled');s.style.cursor='pointer';const t=s.querySelector('.mnltStepTitle'),sub=s.querySelector('.mnltStepSub');if(t)t.textContent='Race Cards';if(sub)sub.textContent='Build cards from approved car photos';s.onclick=()=>{show('traditionalRaceCardsV23');renderCards('trad')}}const mod=d.querySelectorAll('#modifiedRaceHub .mnltStep');if(mod.length>3){const s=mod[3];s.classList.remove('mnltDisabled');s.style.cursor='pointer';const t=s.querySelector('.mnltStepTitle'),sub=s.querySelector('.mnltStepSub');if(t)t.textContent='Race Cards';if(sub)sub.textContent='Build cards from approved car photos';s.onclick=()=>{show('modifiedRaceCardsV23');renderCards('mod')}}}

async function renderCards(type,message){const d=appDoc();if(!d)return;clearUrls();const id=type==='trad'?'traditionalRaceCardsV23':'modifiedRaceCardsV23',body=d.getElementById(id+'Body');if(!body)return;const arr=approvedRegs(type);if(!arr.some(r=>r.id===selected[type]))selected[type]=arr.length?arr[0].id:null;const cur=arr.find(r=>r.id===selected[type])||null;const ready=arr.filter(r=>photoFlag(r,type));const needs=arr.filter(r=>!photoFlag(r,type));const saved=arr.filter(r=>cardSaved(r,type));body.innerHTML=`<div class="v23Header"><div><h2>${type==='trad'?'Traditional':'Modified'} Race Cards</h2><div class="muted">Approved cars only. The car photo is the main image — no racer photo.</div></div><div class="v23Selector"><label for="v23Select${type}">Select racer</label><select id="v23Select${type}"><option value="">${arr.length?'Choose a racer':'No approved racers yet'}</option>${arr.map(r=>`<option value="${r.id}" ${cur&&r.id===cur.id?'selected':''}>${type==='trad'?'#':'M'}${type==='trad'?(r.tradNo||''):(r.modNo||'')} — ${esc(r.name)} — ${esc(carNameFor(r,type))}</option>`).join('')}</select></div></div><div class="v23Summary"><div class="v23Sum"><div class="v23Num">${arr.length}</div><div class="v23Lab">Approved Cars</div></div><div class="v23Sum"><div class="v23Num">${ready.length}</div><div class="v23Lab">With Photo</div></div><div class="v23Sum"><div class="v23Num">${saved.length}</div><div class="v23Lab">Cards Saved</div></div></div><div id="v23Work${type}"></div><div class="v23Cats"><div class="v23Cat"><div class="v23CatTitle v23Saved">Ready / Photo Saved</div><div class="v23Pills">${ready.length?ready.map(r=>`<span class="v23Pill"><button data-pick="${r.id}">${type==='trad'?'#':'M'}${type==='trad'?(r.tradNo||''):(r.modNo||'')} ${esc(r.name)}${cardSaved(r,type)?' ✓':''}</button></span>`).join(''):'<span class="v23Empty">None yet</span>'}</div></div><div class="v23Cat"><div class="v23CatTitle v23NeedPhoto">Needs Photo</div><div class="v23Pills">${needs.length?needs.map(r=>`<span class="v23Pill"><button data-pick="${r.id}">${type==='trad'?'#':'M'}${type==='trad'?(r.tradNo||''):(r.modNo||'')} ${esc(r.name)}</button></span>`).join(''):'<span class="v23Empty">None</span>'}</div></div></div>`;
 const sel=body.querySelector(`#v23Select${type}`);sel.onchange=()=>{selected[type]=Number(sel.value)||null;renderCards(type)};body.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected[type]=Number(b.dataset.pick);renderCards(type)});if(cur)await renderCardWorkspace(type,cur,body.querySelector(`#v23Work${type}`),message);else body.querySelector(`#v23Work${type}`).innerHTML='<p class="muted">Approve a car in Inspection to make its race card available here.</p>'}

async function renderCardWorkspace(type,r,host,message){let blob=null;try{blob=await getPhoto(`${type}:${r.id}`)}catch(e){}const photo=blob?URL.createObjectURL(blob):'';if(photo)objectUrls.push(photo);const arr=approvedRegs(type),idx=arr.findIndex(x=>x.id===r.id),prev=arr.length>1?arr[(idx-1+arr.length)%arr.length]:r,next=arr.length>1?arr[(idx+1)%arr.length]:r;const wt=type==='trad'?((r.tradInspection&&r.tradInspection.weight)?Number(r.tradInspection.weight).toFixed(2)+' oz':'—'):'';const number=type==='trad'?'#'+(r.tradNo||''):'M'+(r.modNo||'');host.innerHTML=`<div class="v23Workspace"><div class="v23CardWrap"><div class="v23Card"><div class="v23Check"></div><div class="v23Hero"><div class="v23Number">${esc(number)}</div>${photo?`<img src="${photo}" alt="${esc(carNameFor(r,type))} car photo">`:'<div class="v23Placeholder">CAR PHOTO NEEDED</div>'}</div><div class="v23Info"><div class="v23CarTitle">${esc(carNameFor(r,type))}</div><div class="v23Racer">${esc(r.name)}</div><div class="v23Meta"><div><div class="v23Division">${type==='trad'?'Traditional Division':'Modified Division'}</div>${type==='trad'?`<div class="v23Weight">Official Weight: ${esc(wt)}</div>`:''}</div></div></div><div class="v23Event">MNLT Pinewood Derby • 2026</div></div></div><div class="v23Controls"><div class="v23Status ${photo?'ready':'need'}">${photo?(cardSaved(r,type)?'✓ CARD SAVED':'✓ PHOTO READY — CARD CAN BE SAVED'):'PHOTO NEEDED BEFORE THIS CARD IS READY'}</div><div class="v23Actions"><button class="btn v23Prev">← Previous</button><button class="btn v23Next">Next →</button><button class="btn v23Photo">${photo?'REPLACE PHOTO':'TAKE / ADD PHOTO'}</button><input class="v23File" type="file" accept="image/*" capture="environment"><button class="btn v23Save" ${photo?'':'disabled'}>SAVE CARD</button></div><div class="v23Msg">${esc(message||'')}</div></div></div>`;
 host.querySelector('.v23Prev').onclick=()=>{selected[type]=prev.id;renderCards(type)};host.querySelector('.v23Next').onclick=()=>{selected[type]=next.id;renderCards(type)};const photoBtn=host.querySelector('.v23Photo'),file=host.querySelector('.v23File');photoBtn.onclick=()=>file.click();file.onchange=async()=>{const f=file.files&&file.files[0];if(!f)return;photoBtn.disabled=true;photoBtn.textContent='SAVING PHOTO...';try{const b=await compressImage(f);await putPhoto(`${type}:${r.id}`,b);markPhotoSaved(r,type);setTimeout(()=>renderCards(type,'Photo saved. Card updated.'),70)}catch(e){console.error(e);renderCards(type,'Could not save photo. Please try again.')}};const save=host.querySelector('.v23Save');if(!save.disabled)save.onclick=()=>markCardSaved(r,type)}

function hideInnerVersions(){try{let w=shell.contentWindow;for(let i=0;i<22;i++){const d=w.document;d.querySelectorAll('.version,#mnltVersion').forEach(v=>v.style.setProperty('display','none','important'));d.title='MNLT Derby Manager v23';const f=d.querySelector('iframe');if(!f||!f.contentWindow)break;w=f.contentWindow}}catch(e){}}
function apply(){hideInnerVersions();const d=appDoc();if(!d)return;installStyle(d);createPage(d,'trad');createPage(d,'mod');enableSteps(d)}
shell.addEventListener('load',()=>{setTimeout(apply,150);setTimeout(apply,700);setTimeout(apply,1600)});setInterval(apply,500);
})();
</script>
</body>
</html>
