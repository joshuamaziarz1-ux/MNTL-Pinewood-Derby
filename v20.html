<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Manager v20</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1522;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#0b1522}
#mnltVersion{position:fixed;left:8px;bottom:5px;z-index:2147483647;color:#778a9d;font:12px Arial,sans-serif;pointer-events:none;background:#0b1522;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<iframe id="shell" title="MNLT Derby Manager v20" src="v19.html?v=20-1442"></iframe>
<div id="mnltVersion">v20</div>
<script>
(function(){
'use strict';
const shell=document.getElementById('shell');
function patch(){
  try{
    let w=shell.contentWindow;
    for(let depth=0;depth<14;depth++){
      const d=w.document;
      d.querySelectorAll('.version,#mnltVersion').forEach(v=>{v.style.setProperty('display','none','important')});
      d.title='MNLT Derby Manager v20';

      // v18 owns the Check-In workflow. Replace only its native browser confirm
      // prompts so Check-In stays fast and non-blocking on phones/tablets.
      if((w.location.pathname||'').endsWith('/v18.html')){
        w.confirm=function(){return true};
      }

      const f=d.querySelector('iframe');
      if(!f||!f.contentWindow)break;
      w=f.contentWindow;
    }
  }catch(e){}
}
shell.addEventListener('load',()=>{setTimeout(patch,100);setTimeout(patch,500);setTimeout(patch,1200)});
setInterval(patch,250);
})();
</script>
</body>
</html>
