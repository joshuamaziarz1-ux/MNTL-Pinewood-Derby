<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>MNLT Pinewood Derby • Audience Projector v41</title><style>
*{box-sizing:border-box}:root{--bg:#07111d;--panel:#101d2d;--line:#29415c;--text:#f7f9fc;--muted:#9eb0c2;--gold:#d8a63d;--gold2:#f2ca69;--blue:#76b8de}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(circle at 50% 4%,#142b48 0,#0a1726 44%,#07111d 100%)}#screen{height:100vh;padding:20px 28px 18px;display:flex;flex-direction:column}.top{text-align:center;flex:0 0 auto}.eyebrow{font-size:clamp(14px,1.1vw,20px);font-weight:900;letter-spacing:.16em;color:var(--muted)}.headline{font-size:clamp(36px,4vw,66px);font-weight:1000;line-height:1;margin-top:5px}.sub{font-size:clamp(18px,1.55vw,27px);font-weight:900;color:var(--gold2);margin-top:7px}.cards,.finalGrid{flex:1;min-height:0;width:100%;max-width:1700px;margin:17px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.finalCard{min-width:0;min-height:0;background:linear-gradient(160deg,#13243a,#0c1928 68%);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 34px #0007}.card.winner,.finalCard.p1{border:3px solid var(--gold)}.photo,.finalPhoto{flex:1;min-height:0;background:radial-gradient(circle,#20334d,#0b1522);background-position:center;background-size:cover;background-repeat:no-repeat;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.noPhoto{padding:28px;text-align:center;color:#71879c;font-size:clamp(21px,1.9vw,33px);font-weight:1000}.photo.hasPhoto .noPhoto,.finalPhoto.hasPhoto .noPhoto{display:none}.badge,.place{position:absolute;top:14px;z-index:3;border-radius:10px;padding:9px 13px;font-weight:1000;box-shadow:0 5px 15px #0008}.badge{left:14px;background:var(--gold);color:#111820;font-size:clamp(20px,1.8vw,30px)}.place{right:14px;background:#f4f7fb;color:#101820;font-size:clamp(24px,2.25vw,37px)}.info,.finalInfo{flex:0 0 auto;padding:15px 18px 17px;border-top:1px solid #253a52}.carName,.finalCar{font-size:clamp(27px,2.45vw,42px);line-height:1.02;font-weight:1000;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.racerName,.finalRacer{font-size:clamp(18px,1.55vw,27px);font-weight:900;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.smallMeta{font-size:clamp(12px,1vw,16px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}.waiting,.tieBox{flex:1;display:grid;place-items:center;text-align:center}.waitingBox{max-width:1100px}.event{font-size:clamp(28px,3vw,48px);font-weight:1000;color:var(--gold2);letter-spacing:.06em}.waitDivision{font-size:clamp(48px,6vw,94px);font-weight:1000;line-height:.95;margin-top:16px}.waitMessage{font-size:clamp(25px,2.7vw,42px);font-weight:900;margin-top:20px}.watch,.tieNote{font-size:clamp(17px,1.5vw,25px);font-weight:800;color:var(--muted);margin-top:18px}.tieInner{width:min(1150px,92vw);background:#111e2e;border:2px solid var(--gold);border-radius:22px;padding:34px 42px;box-shadow:0 18px 45px #0008}.tieTitle{font-size:clamp(42px,5vw,78px);font-weight:1000;line-height:1;color:var(--gold2)}.tiePlace{font-size:clamp(24px,2.3vw,36px);font-weight:900;margin-top:12px}.tieCars{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}.tieChip{background:#1b2b3e;border:1px solid #38516d;border-radius:12px;padding:12px 17px;font-size:clamp(20px,1.8vw,29px);font-weight:1000}.finalPlace{text-align:center;padding:10px;font-size:clamp(29px,2.8vw,46px);font-weight:1000;background:#0c1826;border-bottom:1px solid #31475e}.p1 .finalPlace{background:#3a2b0d;color:#ffe18a}.p2 .finalPlace{color:#e5edf4}.p3 .finalPlace{color:#e6ad83}.exCard{border-color:var(--blue)!important}.exCard .badge{background:var(--blue)}.tiny{position:fixed;right:8px;bottom:6px;font-size:11px;color:#526a81;font-weight:800}.accent{position:fixed;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#8d6b25,#d8a63d,#f2ca69,#d8a63d,#8d6b25)}@media(max-width:1050px){#screen{padding:14px}.cards,.finalGrid{grid-template-columns:1fr 1fr;gap:12px}.headline{font-size:42px}.info,.finalInfo{padding:11px 14px}.carName,.finalCar{font-size:28px}.racerName,.finalRacer{font-size:20px}}
</style></head><body><div id="screen"></div><div class="tiny">MNLT Pinewood Derby • v41</div><div class="accent"></div><script>
'use strict';const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos',RESULT_MS=6500,UP_NEXT_MS=5000,TOP=4;let S=null,token=0,urls=[],tm=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ord=n=>n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH';const clone=v=>{try{return JSON.parse(JSON.stringify(v))}catch(e){return null}};
function state(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};if(!x||typeof x!=='object')x={};x.registrations=Array.isArray(x.registrations)?x.registrations:[];x.racers=Array.isArray(x.racers)?x.racers:[];x.heats=Array.isArray(x.heats)?x.heats:[];x.modified=x.modified&&typeof x.modified==='object'?x.modified:{};x.modified.raceRacers=Array.isArray(x.modified.raceRacers)?x.modified.raceRacers:[];x.modified.heats=Array.isArray(x.modified.heats)?x.modified.heats:[];x.modified.exhibition=x.modified.exhibition||{active:false};return x}
function stop(){if(tm){clearTimeout(tm);tm=null}}function free(){urls.forEach(URL.revokeObjectURL);urls=[]}function modified(st){return String(st?.raceType||'Traditional').toLowerCase()==='modified'}function divName(m){return m?'MODIFIED DIVISION':'TRADITIONAL DIVISION'}function done(h){const n=(h?.lanes||[]).filter(Boolean).length;return n>0&&Array.isArray(h?.results)&&h.results.length===n}function allDone(h){return h.length>0&&h.every(done)}
function ctx(st){const m=modified(st);if(m&&st.modified.exhibition?.active)return{mode:'ex',m,reg:st.registrations.find(r=>r.id===st.modified.exhibition.registrationId)||null,lane:Number(st.modified.exhibition.lane)||2};const ro=m?(st.modified.runoff?.active?st.modified.runoff:null):(st.runoff?.active?st.runoff:null);return{mode:'race',m,ro,heats:ro?ro.heats:(m?st.modified.heats:st.heats),current:Number(ro?ro.current:(m?st.modified.current:st.current))||0}}
function racer(st,m,id){return(m?st.modified.raceRacers:st.racers).find(r=>String(r.id)===String(id))||null}function regFor(st,m,r){if(!r)return null;return st.registrations.find(x=>String(x.id)===String(r.registrationId)||(m?String(x.modRacerId)===String(r.id):String(x.tradRacerId)===String(r.id)))||null}function car(st,m,r){const q=regFor(st,m,r),v=(q&&(m?q.modCar:q.tradCar))||r?.car||'Unnamed Car';return String(v).trim()||'Unnamed Car'}
function db(){return new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function photo(key){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}async function setPhoto(el,key,t){if(!key)return;const b=await photo(key).catch(()=>null);if(b&&t===token&&el?.isConnected){const u=URL.createObjectURL(b);urls.push(u);el.style.backgroundImage=`url(${JSON.stringify(u)})`;el.classList.add('hasPhoto')}}
function head(eye,big,sub=''){return`<div class="top"><div class="eyebrow">${esc(eye)}</div><div class="headline">${esc(big)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`}
function raw(st,m){const rs=m?st.modified.raceRacers:st.racers,hs=m?st.modified.heats:st.heats,map=new Map(rs.map(r=>[String(r.id),{id:r.id,name:r.name,number:r.number,points:0,races:0}]));hs.forEach(h=>(h.results||[]).forEach(x=>{const a=map.get(String(x.racerId));if(a){a.points+=Number(x.points)||0;a.races++}}));return[...map.values()].sort((a,b)=>a.points-b.points||(Number(a.number)||0)-(Number(b.number)||0))}const eq=(a,b)=>Math.abs(Number(a)-Number(b))<1e-9;function key(g){return`${g.map(r=>String(r.id)).sort().join(',')}@${g.length?Number(g[0].points).toFixed(6):'0'}`}function store(st,m){return m?(st.modified.tieBreaks||{}):(st.tieBreaks||{})}function resolved(st,m,g){const t=store(st,m)[key(g)];if(!t||!Array.isArray(t.order)||t.order.length!==g.length)return null;const a=new Set(g.map(r=>String(r.id))),b=new Set(t.order.map(String));return a.size===b.size&&[...a].every(x=>b.has(x))?t:null}
function final(st,m){const a=raw(st,m);for(let i=0;i<a.length;){let j=i+1;while(j<a.length&&eq(a[j].points,a[i].points))j++;if(j-i>1){const g=a.slice(i,j),t=resolved(st,m,g);if(t){const p=new Map(t.order.map((id,k)=>[String(id),k]));a.splice(i,j-i,...g.sort((x,y)=>p.get(String(x.id))-p.get(String(y.id))))}}i=j}return a}function pending(st,m){const a=raw(st,m);for(let i=0;i<a.length;){let j=i+1;while(j<a.length&&eq(a[j].points,a[i].points))j++;if(j-i>1&&i<TOP){const g=a.slice(i,j);if(!resolved(st,m,g))return{start:i,end:j-1,racers:g}}i=j}return null}function range(g){return g.start===g.end?ord(g.start+1):`${ord(g.start+1)}–${ord(g.end+1)}`}
async function cards(st,m,h,mode,total,ro){const t=++token;free();const results=mode==='results',mp=new Map((h.results||[]).map(x=>[String(x.racerId),x.position])),list=(h.lanes||[]).map((id,i)=>({id,lane:i+1,pos:id?mp.get(String(id)):null})).filter(x=>x.id);if(results)list.sort((a,b)=>(a.pos||99)-(b.pos||99));const eye=ro?`${divName(m)} • TROPHY RUNOFF`:divName(m),big=results?'HEAT RESULTS':mode==='up'?'UP NEXT':'NOW RACING',sub=`${ro?`SET ${ro.attempt} • `:''}HEAT ${h.id} OF ${total}${ro?` • ${ord(ro.placeStart)}${ro.placeEnd!==ro.placeStart?'–'+ord(ro.placeEnd):''} PLACE TIE`:''}`;document.getElementById('screen').innerHTML=head(eye,big,sub)+'<div class="cards" id="cards"></div>';const host=document.getElementById('cards');for(const x of list){if(t!==token)return;const r=racer(st,m,x.id);if(!r)continue;const q=regFor(st,m,r),c=car(st,m,r),d=document.createElement('div');d.className='card'+(results&&x.pos===1?' winner':'');d.innerHTML=`<div class="photo"><div class="badge">LANE ${x.lane}</div>${results?`<div class="place">${ord(x.pos)}</div>`:''}<div class="noPhoto">${esc(c)}</div></div><div class="info"><div class="carName">${esc(c)}</div><div class="racerName">${esc(r.name||'')}</div><div class="smallMeta">${results?'Heat finish':'Watch for your lane'}</div></div>`;host.appendChild(d);await setPhoto(d.querySelector('.photo'),q?`${m?'mod':'trad'}:${q.id}`:null,t)}}
function waiting(m){++token;free();document.getElementById('screen').innerHTML=`<div class="waiting"><div class="waitingBox"><div class="event">MNLT PINEWOOD DERBY</div><div class="waitDivision">${divName(m)}</div><div class="waitMessage">RACE STARTING SOON</div><div class="watch">Watch this screen for your car name and lane.</div></div></div>`}
async function exhibition(st,c){const t=++token;free();if(!c.reg)return waiting(true);const name=String(c.reg.modCar||'Unnamed Car').trim()||'Unnamed Car';document.getElementById('screen').innerHTML=head('MODIFIED DIVISION','EXHIBITION RUN','NOT SCORED • NOT PART OF OFFICIAL STANDINGS')+`<div class="cards" style="grid-template-columns:minmax(350px,570px);justify-content:center"><div class="card exCard" id="ex"><div class="photo"><div class="badge">LANE ${c.lane}</div><div class="noPhoto">${esc(name)}</div></div><div class="info"><div class="carName" style="color:#b9e6ff">${esc(name)}</div><div class="racerName">${esc(c.reg.name||'')}</div><div class="smallMeta">Modified Exhibition</div></div></div></div>`;await setPhoto(document.querySelector('#ex .photo'),`mod:${c.reg.id}`,t)}
function tieScreen(st,m,g,title='TROPHY RUNOFF REQUIRED',note='These cars will race again.'){++token;free();const chips=g.racers.map(s=>{const r=racer(st,m,s.id)||s,c=car(st,m,r);return`<div class="tieChip">${esc(c)} <span style="color:var(--muted);font-size:.78em">• ${esc(r.name||'')}</span></div>`}).join('');document.getElementById('screen').innerHTML=head(divName(m),title,`${range(g)} PLACE TIE`)+`<div class="tieBox"><div class="tieInner"><div class="tieTitle">TIE ON THE TRACK</div><div class="tiePlace">${esc(note)}</div><div class="tieCars">${chips}</div><div class="tieNote">The trophy place will be settled by a verified runoff.</div></div></div>`}
function stillTied(st,m,ro){++token;free();const ids=ro.blocks?.[ro.nextBlockIndex]||ro.currentIds||[],chips=ids.map(id=>{const r=racer(st,m,id),c=car(st,m,r);return`<div class="tieChip">${esc(c)} <span style="color:var(--muted);font-size:.78em">• ${esc(r?.name||'')}</span></div>`}).join('');document.getElementById('screen').innerHTML=head(`${divName(m)} • TROPHY RUNOFF`,'TIE REMAINS',`RUNOFF SET ${ro.attempt} COMPLETE`)+`<div class="tieBox"><div class="tieInner"><div class="tieTitle">RACE AGAIN</div><div class="tiePlace">Only the cars still tied continue.</div><div class="tieCars">${chips}</div><div class="tieNote">Racers already separated keep their finishing order.</div></div></div>`}
async function finals(st,m){const t=++token;free(),a=final(st,m).slice(0,4);document.getElementById('screen').innerHTML=head(divName(m),'FINAL RESULTS','MNLT PINEWOOD DERBY')+'<div class="finalGrid" id="fg"></div>';const host=document.getElementById('fg');for(let i=0;i<a.length;i++){const r=racer(st,m,a[i].id),q=regFor(st,m,r),c=car(st,m,r),d=document.createElement('div');d.className=`finalCard p${i+1}`;d.innerHTML=`<div class="finalPlace">${ord(i+1)} PLACE</div><div class="finalPhoto"><div class="noPhoto">${esc(c)}</div></div><div class="finalInfo"><div class="finalCar">${esc(c)}</div><div class="finalRacer">${esc(r?.name||a[i].name||'')}</div></div>`;host.appendChild(d);await setPhoto(d.querySelector('.finalPhoto'),q?`${m?'mod':'trad'}:${q.id}`:null,t)}}
async function normal(){stop();S=state();const c=ctx(S);if(c.mode==='ex')return exhibition(S,c);if(!c.heats.length)return waiting(c.m);if(c.ro?.completed)return stillTied(S,c.m,c.ro);if(!c.ro&&allDone(c.heats)){const g=pending(S,c.m);return g?tieScreen(S,c.m,g):finals(S,c.m)}const i=Math.max(0,Math.min(c.current,c.heats.length-1)),h=c.heats[i];return h?cards(S,c.m,h,done(h)?'results':'racing',c.heats.length,c.ro):waiting(c.m)}
function newlySaved(oldSt,newSt){if(!oldSt)return null;const m=modified(newSt),nr=m?newSt.modified.runoff:newSt.runoff,or=m?oldSt.modified.runoff:oldSt.runoff;if(nr?.active&&or?.active){for(const h of nr.heats||[]){const o=(or.heats||[]).find(x=>String(x.id)===String(h.id));if(done(h)&&!done(o))return{m,h:clone(h),total:nr.heats.length,ro:clone(nr)}}}const nh=m?newSt.modified.heats:newSt.heats,oh=m?oldSt.modified.heats:oldSt.heats;for(const h of nh||[]){const o=(oh||[]).find(x=>String(x.id)===String(h.id));if(done(h)&&!done(o))return{m,h:clone(h),total:nh.length,ro:null}}return null}
async function sequence(e){stop();await cards(state(),e.m,e.h,'results',e.total,e.ro);tm=setTimeout(async()=>{S=state();const c=ctx(S);if(c.mode==='ex')return exhibition(S,c);if(!c.heats.length)return waiting(c.m);if(c.ro?.completed)return stillTied(S,c.m,c.ro);if(!c.ro&&allDone(c.heats)){const g=pending(S,c.m);return g?tieScreen(S,c.m,g):finals(S,c.m)}const i=Math.max(0,Math.min(c.current,c.heats.length-1)),h=c.heats[i];if(!h||done(h))return normal();await cards(S,c.m,h,'up',c.heats.length,c.ro);tm=setTimeout(normal,UP_NEXT_MS)},RESULT_MS)}
async function update(){const old=S?clone(S):null,n=state(),e=newlySaved(old,n);S=n;return e?sequence(e):normal()}window.addEventListener('storage',e=>{if(e.key===KEY)update()});try{new BroadcastChannel('mnltDerbyV2Channel').onmessage=update}catch(e){}try{new BroadcastChannel('mnltDerbyLive').onmessage=update}catch(e){}document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});S=state();normal();
</script></body></html>
