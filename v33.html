<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MNLT Derby Manager v33</title><style>html,body{margin:0;height:100%;background:#0b1522;color:#fff;font-family:Arial,sans-serif}.loading{height:100%;display:grid;place-items:center;font-size:24px;font-weight:900}</style></head>
<body><div class="loading">Loading MNLT Derby Manager…</div>
<script>
fetch('v29.html?v=29-base',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('base');return r.text()}).then(src=>{
 src=src.replace('<title>MNLT Derby Manager v29</title>','<title>MNLT Derby Manager v33</title>');
 src=src.replace('<div class="toast" id="toast"></div><div class="version">v29 BASE</div>','<div class="toast" id="toast"></div><div class="version">v33</div>');
 src=src.replace('<div class="cardHero"><div class="cardNo">${numLabel(cur,type)}</div><div id="cardPhoto" class="cardNoPhoto">CAR PHOTO</div></div>','<div class="cardHero"><div id="cardPhoto" class="cardNoPhoto">CAR PHOTO</div></div>');
 src=src.replace("function openProjector(){window.open(location.pathname+'?projector=1&v=29','mnltProjector','width=1500,height=900')}","function openProjector(){window.open('v30-projector.html?v=33','mnltProjector','width=1500,height=900')}");
 src=src.replace("$('liveProjector').onclick=openProjector;$('preRace').onclick=()=>window.open('v17-prerace.html?v=29','mnltPreRace','width=1500,height=900');","$('liveProjector').onclick=openProjector;$('preRace').onclick=()=>window.open('v30-prerace.html?v=33','mnltPreRace','width=1500,height=900');");
 const shim=`<script>(function(){
 try{const k='mnltDerbyRegistrationBridgeV1',c=JSON.parse(localStorage.getItem(k)||'null');if(c&&c.url){const u=new URL(c.url);u.searchParams.delete('authuser');c.url=u.toString();localStorage.setItem(k,JSON.stringify(c));}}catch(e){}
 const nativeAppend=HTMLHeadElement.prototype.appendChild;
 HTMLHeadElement.prototype.appendChild=function(node){
  try{
   if(node&&node.tagName==='SCRIPT'&&/^https:\/\/script\\.google\\.com\/macros\/s\//i.test(node.src)){
    const u=new URL(node.src),cb=u.searchParams.get('callback');
    if(cb&&/^__mnltBridge_\\d+_\\d+$/.test(cb)){
     u.searchParams.delete('authuser');
     const frame=document.createElement('iframe');frame.style.display='none';frame.setAttribute('sandbox','allow-scripts');try{frame.credentialless=true}catch(e){}
     const tag='mnlt-sandbox-'+cb;
     const handler=function(ev){if(ev.source!==frame.contentWindow||!ev.data||ev.data.tag!==tag)return;window.removeEventListener('message',handler);frame.remove();if(ev.data.error){if(typeof node.onerror==='function')node.onerror(new Event('error'));return;}const fn=window[cb];if(typeof fn==='function')fn(ev.data.payload)};
     window.addEventListener('message',handler);
     const safeUrl=u.toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;');
     frame.srcdoc='<script>window['+JSON.stringify(cb)+']=function(d){parent.postMessage({tag:'+JSON.stringify(tag)+',payload:d},"*")};<\\/script><script src="'+safeUrl+'" onerror="parent.postMessage({tag:'+JSON.stringify(tag)+',error:true},\'*\')"><\\/script>';
     document.body.appendChild(frame);return node;
    }
   }
  }catch(e){}
  return nativeAppend.call(this,node)
 };
})();<\/script>`;
 src=src.replace('</body>',shim+'<script src="v31-email-bridge.js?v=33"><\\/script></body>');
 document.open();document.write(src);document.close();
}).catch(()=>{document.body.innerHTML='<div class="loading">Could not load the Derby Manager. Refresh the page.</div>'});
</script></body></html>
