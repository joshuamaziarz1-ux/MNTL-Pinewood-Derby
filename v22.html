<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Manager v22</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1522;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#0b1522}
#mnltVersion{position:fixed;left:8px;bottom:5px;z-index:2147483647;color:#778a9d;font:12px Arial,sans-serif;pointer-events:none;background:#0b1522;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<iframe id="shell" title="MNLT Derby Manager v22" src="v21.html?v=22-1452"></iframe>
<div id="mnltVersion">v22</div>
<script>
(function(){
'use strict';
const shell=document.getElementById('shell');
const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos';
let current={trad:null,mod:null};

function appWin(){try{let w=shell.contentWindow;for(let i=0;i<18;i++){const f=w.document.querySelector('iframe');if(!f||!f.contentWindow)break;w=f.contentWindow}return w}catch(e){return null}}
function appDoc(){const w=appWin();return w?w.document:null}
function show(id){const w=appWin();if(w&&typeof w.show==='function')w.show(id)}
function readState(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putPhoto(key,blob){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(blob,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getPhoto(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function compressImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.84))}finally{URL.revokeObjectURL(url)}}

const tradItems=[['length','Length is 7.0 in maximum'],['width','Overall width is 2 3/4 in maximum'],['clearance','Underbody clearance is at least 3/8 in'],['height','Car clears the finish-line / timer'],['body','Main body is pine only'],['wheels','Official BSA Grand Prix wheels'],['axles','Official BSA Grand Prix axles'],['wheelMods','Wheel modifications are polishing / smoothing only'],['axleMods','Axle modifications are deburring / polishing only'],['fourWheels','All 4 wheels touch'],['noHardware','No bearings, washers, bushings, or springs'],['dryLube','Dry lubricant only'],['secureWeights','Weights are securely attached'],['gravity','Gravity powered only'],['trackSafe','Car is safe and will not damage the track']];
const modItems=[['trackSafe','Car will not damage the track'],['noBurning','No burning, flame, or track-damaging effect'],['secure','Parts and weights are securely attached']];
function field(type){return type==='trad'?'tradInspection':'modInspection'}
function regs(type){const s=readState();if(!s||!Array.isArray(s.registrations))return[];const ci=type==='trad'?'tradCheckIn':'modCheckIn';return s.registrations.filter(r=>r.status!=='Withdrawn'&&r[ci]==='checked'&&(type==='trad'?(r.division==='Traditional'||r.division==='Both'):(r.division==='Modified'||r.division==='Both'))).sort((a,b)=>((type==='trad'?a.tradNo:a.modNo)||9999)-((type==='trad'?b.tradNo:b.modNo)||9999)||String(a.name).localeCompare(String(b.name)))}
function ins(r,type){const x=r[field(type)]||{};return{weight:x.weight??'',items:x.items||{},approved:!!x.approved,approvedAt:x.approvedAt||'',photoSaved:!!x.photoSaved,savedAt:x.savedAt||''}}
function failed(r,type){const x=ins(r,type);if(x.approved)return false;const overweight=type==='trad'&&x.weight!==''&&Number(x.weight)>5;return !!x.savedAt||overweight||Object.values(x.items).includes('fail')}
function allAnswered(r,type){const x=ins(r,type),items=type==='trad'?tradItems:modItems;if(!items.every(([k])=>x.items[k]==='pass'||x.items[k]==='fail'))return false;if(type==='trad'){const w=Number(x.weight);return x.weight!==''&&Number.isFinite(w)&&w>0}return true}
function passes(r,type){const x=ins(r,type),items=type==='trad'?tradItems:modItems;if(!items.every(([k])=>x.items[k]==='pass'))return false;if(type==='trad'){const w=Number(x.weight);return Number.isFinite(w)&&w>0&&w<=5}return true}
function mutate(code){const w=appWin();if(!w)return false;try{w.eval(`mutate(()=>{${code}})`);return true}catch(e){console.error(e);return false}}
function regCode(id){return `const r=S.registrations.find(x=>x.id===${Number(id)});if(!r)return;if(!r.${field(activeType())})r.${field(activeType())}={weight:'',items:{},approved:false,approvedAt:'',photoSaved:false,savedAt:''};`}
function activeType(){return window.__mnltV22ActiveType||'trad'}

function installStyle(d){if(d.getElementById('mnltV22Style'))return;const s=d.createElement('style');s.id='mnltV22Style';s.textContent=`
.v22Nav{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0e1c2c;border:1px solid #30465f;border-radius:10px;padding:10px 12px;margin-bottom:14px}.v22NavBtns{display:flex;gap:8px}.v22Crumb{color:#aab9c8;font-weight:700}
.v22Top{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:14px;align-items:end}.v22Top select{font-size:19px;font-weight:800;margin:6px 0 0}.v22Counts{display:flex;gap:8px;flex-wrap:wrap}.v22Count{background:#0e1c2c;border:1px solid #30465f;border-radius:10px;padding:9px 12px;font-weight:800}.v22Count b{font-size:22px;margin-right:5px}
.v22Form{margin-top:18px;background:#0e1c2c;border:2px solid #30465f;border-radius:14px;padding:16px}.v22FormHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.v22Name{font-size:26px;font-weight:900}.v22CarName{color:#aab9c8;margin-top:4px}.v22Progress{font-weight:900;color:#d8a63d}.v22Weight{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:14px;align-items:center;background:#13243a;border-radius:10px;padding:14px;margin:14px 0}.v22Weight input{font-size:28px;font-weight:900;margin:0}.v22WeightState{font-size:20px;font-weight:900}.v22PassText{color:#9ee7af}.v22FailText{color:#ff9da7}.v22WaitText{color:#aab9c8}
.v22Item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #30465f}.v22Item:last-child{border-bottom:0}.v22ItemText{font-weight:700}.v22Btns{display:flex;gap:7px}.v22Btns .btn{padding:9px 13px}.v22Pass{background:#2e8050!important}.v22Fail{background:#8d3541!important}.v22SaveBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:16px;margin-top:14px;border-top:1px solid #30465f}.v22SaveBar .primary{font-size:19px;padding:14px 20px}.v22Hint{color:#aab9c8}
.v22Lists{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.v22Bucket{background:#0e1c2c;border:1px solid #30465f;border-radius:12px;padding:14px}.v22Bucket h3{margin:0 0 10px}.v22Card{background:#13243a;border:1px solid #30465f;border-radius:10px;padding:12px;margin:8px 0}.v22Card.ok{border-color:#4e9b67}.v22Card.bad{border-color:#8d4a54}.v22CardTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.v22CardName{font-size:18px;font-weight:900}.v22CardSub{color:#aab9c8;font-size:14px;margin-top:3px}.v22CardActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.v22PhotoBtn{background:#2e8050!important}.v22Photo{max-width:100%;max-height:260px;border-radius:9px;display:block;margin:10px auto}.v22PhotoSaved{color:#9ee7af;font-weight:900;margin-top:8px}.v22Hidden{display:none!important}.v22Empty{color:#aab9c8;padding:8px 0}
@media(max-width:760px){.v22Top,.v22Lists,.v22Weight,.v22Item{grid-template-columns:1fr}.v22Nav{align-items:flex-start;flex-direction:column}.v22Btns{justify-content:flex-start}.v22CardTop{flex-direction:column}}
`;d.head.appendChild(s)}
function pageId(type){return type==='trad'?'traditionalInspectionV22':'modifiedInspectionV22'}
function createPage(d,type){const id=pageId(type);if(d.getElementById(id))return;const p=d.createElement('section');p.id=id;p.className='page hidden';p.innerHTML=`<div class="v22Nav"><div class="v22NavBtns"><button class="btn back">← Back</button><button class="btn home">Home</button></div><div class="v22Crumb">${type==='trad'?'Home > Race Day > Traditional > Inspection':'Home > Race Day > Modified > Inspection'}</div></div><div class="panel"><div id="${id}Body"></div></div>`;d.getElementById('appMain').appendChild(p);p.querySelector('.back').onclick=()=>show(type==='trad'?'traditionalRaceHub':'modifiedRaceHub');p.querySelector('.home').onclick=()=>show('home')}
function enableSteps(d){const t=d.querySelectorAll('#traditionalRaceHub .mnltStep');if(t.length>2){const b=t[2];b.classList.remove('mnltDisabled');b.style.cursor='pointer';b.querySelector('.mnltStepTitle').textContent='Inspection & Car Photo';b.querySelector('.mnltStepSub').textContent='Inspect one car at a time, save, then photograph passed cars';b.onclick=()=>openInspection('trad')}const m=d.querySelectorAll('#modifiedRaceHub .mnltStep');if(m.length>2){const b=m[2];b.classList.remove('mnltDisabled');b.style.cursor='pointer';b.querySelector('.mnltStepTitle').textContent='Inspection & Car Photo';b.querySelector('.mnltStepSub').textContent='Inspect one car at a time';b.onclick=()=>openInspection('mod')}}
function openInspection(type){window.__mnltV22ActiveType=type;show(pageId(type));render(type)}

function choose(type,id){window.__mnltV22ActiveType=type;current[type]=id?Number(id):null;render(type)}
function setWeight(type,id,value){const f=field(type);mutate(`const r=S.registrations.find(x=>x.id===${Number(id)});if(r){if(!r.${f})r.${f}={weight:'',items:{},approved:false,approvedAt:'',photoSaved:false,savedAt:''};r.${f}.weight=${JSON.stringify(value)};r.${f}.approved=false;r.${f}.approvedAt='';}`);render(type,false)}
function setItem(type,id,key,value){const f=field(type);mutate(`const r=S.registrations.find(x=>x.id===${Number(id)});if(r){if(!r.${f})r.${f}={weight:'',items:{},approved:false,approvedAt:'',photoSaved:false,savedAt:''};if(!r.${f}.items)r.${f}.items={};r.${f}.items[${JSON.stringify(key)}]=${JSON.stringify(value)};r.${f}.approved=false;r.${f}.approvedAt='';}`);render(type,false)}
function save(type,id){const list=regs(type),r=list.find(x=>x.id===id);if(!r||!allAnswered(r,type))return;const f=field(type),ok=passes(r,type),now=new Date().toISOString();mutate(`const r=S.registrations.find(x=>x.id===${Number(id)});if(r){if(!r.${f})r.${f}={weight:'',items:{},approved:false,approvedAt:'',photoSaved:false,savedAt:''};r.${f}.approved=${ok};r.${f}.approvedAt=${ok?JSON.stringify(now):"''"};r.${f}.savedAt=${JSON.stringify(now)};}`);current[type]=null;render(type)}
function load(type,id){current[type]=Number(id);render(type);setTimeout(()=>{const d=appDoc(),p=d&&d.getElementById(pageId(type));const f=p&&p.querySelector('.v22Form');if(f)f.scrollIntoView({behavior:'smooth',block:'start'})},50)}
async function takePhoto(type,id,input){const f=input.files&&input.files[0];if(!f)return;const btn=input.parentElement.querySelector('.v22PhotoBtn');if(btn){btn.disabled=true;btn.textContent='SAVING PHOTO...'}try{const blob=await compressImage(f);await putPhoto(`${type}:${id}`,blob);const fld=field(type);mutate(`const r=S.registrations.find(x=>x.id===${Number(id)});if(r&&r.${fld})r.${fld}.photoSaved=true;`)}catch(e){console.error(e)}render(type)}
async function showSavedPhoto(type,id,host){try{const blob=await getPhoto(`${type}:${id}`);if(!blob)return;const url=URL.createObjectURL(blob);const img=document.createElement('img');img.className='v22Photo';img.alt='Car photo';img.src=url;img.onload=()=>setTimeout(()=>URL.revokeObjectURL(url),1000);host.appendChild(img)}catch(e){}}

function render(type,resetSelect=true){const d=appDoc();if(!d)return;window.__mnltV22ActiveType=type;const body=d.getElementById(pageId(type)+'Body');if(!body)return;const list=regs(type),isTrad=type==='trad',items=isTrad?tradItems:modItems,passed=list.filter(r=>ins(r,type).approved),bad=list.filter(r=>failed(r,type)),pending=list.filter(r=>!ins(r,type).approved&&!failed(r,type));const selected=list.find(r=>r.id===current[type])||null;
 const options=['<option value="">Select a racer...</option>'].concat(list.map(r=>`<option value="${r.id}" ${selected&&selected.id===r.id?'selected':''}>${isTrad?'#'+(r.tradNo||''):'M'+(r.modNo||'')} ${esc(r.name)}${ins(r,type).approved?' — PASSED':failed(r,type)?' — NEEDS CORRECTION':''}</option>`)).join('');
 body.innerHTML=`<h2>${isTrad?'Traditional':'Modified'} Inspection & Car Photo</h2><p class="muted">Choose one racer, complete the inspection, then Save Inspection. The form clears for the next racer.</p><div class="v22Top"><div><label>Racer to inspect</label><select class="v22Select">${options}</select></div><div class="v22Counts"><span class="v22Count"><b>${pending.length}</b> Waiting</span><span class="v22Count"><b>${passed.length}</b> Passed</span><span class="v22Count"><b>${bad.length}</b> Needs Correction</span></div></div><div id="v22FormHost"></div><div class="v22Lists"><div class="v22Bucket"><h3>✓ Passed Cars</h3><div class="passedList"></div></div><div class="v22Bucket"><h3>Needs Correction</h3><div class="badList"></div></div></div>`;
 body.querySelector('.v22Select').onchange=e=>choose(type,e.target.value);
 const formHost=body.querySelector('#v22FormHost');if(selected){const x=ins(selected,type),answered=items.filter(([k])=>x.items[k]==='pass'||x.items[k]==='fail').length,num=isTrad?`#${selected.tradNo||''}`:`M${selected.modNo||''}`,carName=isTrad?selected.tradCar:selected.modCar;let weight='';if(isTrad){const w=Number(x.weight),cls=x.weight===''?'v22WaitText':(Number.isFinite(w)&&w>0&&w<=5?'v22PassText':'v22FailText'),txt=x.weight===''?'Enter weight from scale':(Number.isFinite(w)&&w>0&&w<=5?'PASS — 5.00 oz or less':'FAIL — over 5.00 oz');weight=`<div class="v22Weight"><div><label>Car Weight (oz)</label><input class="v22WeightInput" inputmode="decimal" type="number" step="0.01" min="0" value="${esc(x.weight)}" placeholder="0.00"></div><div class="v22WeightState ${cls}">${txt}</div></div>`}
 const rows=items.map(([k,label])=>`<div class="v22Item"><div class="v22ItemText">${esc(label)}</div><div class="v22Btns"><button class="btn ${x.items[k]==='pass'?'v22Pass':''}" data-key="${k}" data-val="pass">PASS</button><button class="btn ${x.items[k]==='fail'?'v22Fail':''}" data-key="${k}" data-val="fail">FAIL</button></div></div>`).join('');const canSave=allAnswered(selected,type);formHost.innerHTML=`<div class="v22Form"><div class="v22FormHead"><div><div class="v22Name">${num} ${esc(selected.name)}</div><div class="v22CarName">Car: ${esc(carName||'Car name not entered')}</div></div><div class="v22Progress">${answered} of ${items.length} checks complete</div></div>${weight}<div>${rows}</div><div class="v22SaveBar"><button class="btn primary v22Save" ${canSave?'':'disabled'}>SAVE INSPECTION</button><span class="v22Hint">${canSave?'Ready to save.':'Complete every item'+(isTrad?' and enter the weight':'')+' first.'}</span></div></div>`;
 if(isTrad){const inp=formHost.querySelector('.v22WeightInput');inp.onchange=()=>setWeight(type,selected.id,inp.value);inp.onblur=()=>{if(inp.value!==String(ins(selected,type).weight))setWeight(type,selected.id,inp.value)}}formHost.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>setItem(type,selected.id,b.dataset.key,b.dataset.val));const sb=formHost.querySelector('.v22Save');if(sb)sb.onclick=()=>save(type,selected.id)}
 const pList=body.querySelector('.passedList');pList.innerHTML=passed.length?'':'<div class="v22Empty">No cars have passed yet.</div>';passed.forEach(r=>{const x=ins(r,type),num=isTrad?`#${r.tradNo||''}`:`M${r.modNo||''}`,card=d.createElement('div');card.className='v22Card ok';card.innerHTML=`<div class="v22CardTop"><div><div class="v22CardName">${num} ${esc(r.name)}</div><div class="v22CardSub">${isTrad?'Official weight: '+esc(x.weight)+' oz • ':''}${x.photoSaved?'Photo saved':'Photo needed'}</div></div><span class="v22PassText"><b>PASSED</b></span></div><div class="v22CardActions"><button class="btn v22PhotoBtn">${x.photoSaved?'RETAKE PHOTO':'TAKE CAR PHOTO'}</button><input class="v22Hidden photoInput" type="file" accept="image/*" capture="environment"><button class="btn reinspect">Reinspect</button></div><div class="photoHost"></div>`;card.querySelector('.v22PhotoBtn').onclick=()=>card.querySelector('.photoInput').click();card.querySelector('.photoInput').onchange=e=>takePhoto(type,r.id,e.target);card.querySelector('.reinspect').onclick=()=>load(type,r.id);pList.appendChild(card);if(x.photoSaved)showSavedPhoto(type,r.id,card.querySelector('.photoHost'))});
 const bList=body.querySelector('.badList');bList.innerHTML=bad.length?'':'<div class="v22Empty">No cars need correction.</div>';bad.forEach(r=>{const x=ins(r,type),num=isTrad?`#${r.tradNo||''}`:`M${r.modNo||''}`,fails=items.filter(([k])=>x.items[k]==='fail').map(([,label])=>label);if(isTrad&&x.weight!==''&&Number(x.weight)>5)fails.unshift(`Weight ${x.weight} oz`);const card=d.createElement('div');card.className='v22Card bad';card.innerHTML=`<div class="v22CardTop"><div><div class="v22CardName">${num} ${esc(r.name)}</div><div class="v22CardSub">${fails.length?esc(fails.join(' • ')):'Inspection needs correction'}</div></div><span class="v22FailText"><b>FAILED</b></span></div><div class="v22CardActions"><button class="btn loadFail">LOAD INSPECTION</button></div>`;card.querySelector('.loadFail').onclick=()=>load(type,r.id);bList.appendChild(card)});
}
function hideInnerVersions(){try{let w=shell.contentWindow;for(let i=0;i<18;i++){const d=w.document;d.querySelectorAll('.version,#mnltVersion').forEach(v=>v.style.setProperty('display','none','important'));d.title='MNLT Derby Manager v22';const f=d.querySelector('iframe');if(!f||!f.contentWindow)break;w=f.contentWindow}}catch(e){}}
function apply(){const d=appDoc();if(!d)return;installStyle(d);createPage(d,'trad');createPage(d,'mod');enableSteps(d);hideInnerVersions()}
shell.addEventListener('load',()=>{setTimeout(apply,200);setTimeout(apply,900);setTimeout(apply,1600)});setInterval(apply,500);
})();
</script>
</body>
</html>
