<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111d">
<title>MNLT Pinewood Derby Pre-Race • v30</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#173254 0,#0a1b2e 47%,#050b12 100%)}
.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 28px);pointer-events:none}
.checkers{position:absolute;left:0;right:0;height:52px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0/52px 52px;opacity:.12}.checkers.top{top:0}.checkers.bottom{bottom:0}
.speed{position:absolute;height:4px;background:linear-gradient(90deg,transparent,#e6b64b,transparent);transform:skewX(-30deg);opacity:.42;animation:fly 3.5s linear infinite}.s1{width:45vw;top:18%;left:-50vw}.s2{width:34vw;top:32%;left:-42vw;animation-delay:.8s}.s3{width:52vw;bottom:24%;left:-58vw;animation-delay:1.7s}.s4{width:26vw;bottom:38%;left:-35vw;animation-delay:2.4s}@keyframes fly{to{left:115vw}}
.frame{position:relative;z-index:2;width:min(94vw,1500px);height:min(84vh,860px);border:2px solid rgba(230,182,75,.72);border-radius:26px;background:linear-gradient(145deg,rgba(16,37,61,.98),rgba(6,16,28,.98));box-shadow:0 28px 80px rgba(0,0,0,.55),inset 0 0 70px rgba(230,182,75,.04);overflow:hidden;padding:58px 68px;display:flex;flex-direction:column;justify-content:center}
.frame:before{content:"";position:absolute;top:-100px;right:-120px;width:440px;height:250px;background:#c93842;transform:rotate(-16deg);opacity:.16}.frame:after{content:"";position:absolute;bottom:-130px;left:-90px;width:520px;height:240px;background:#e6b64b;transform:rotate(12deg);opacity:.10}
.eyebrow{position:relative;z-index:2;font-size:clamp(18px,2vw,30px);font-weight:900;letter-spacing:.18em;color:#e6b64b;text-transform:uppercase}.title{position:relative;z-index:2;margin:12px 0 10px;font-size:clamp(52px,7vw,110px);line-height:.93;font-weight:1000;letter-spacing:-.04em;text-transform:uppercase;text-shadow:0 8px 28px rgba(0,0,0,.45)}.title .gold{color:#e6b64b}.title .red{color:#ef5961}.sub{position:relative;z-index:2;margin-top:14px;font-size:clamp(24px,3vw,46px);font-weight:800;color:#dce7f1}.bigline{position:relative;z-index:2;font-size:clamp(34px,4.4vw,68px);line-height:1.25;font-weight:950;margin:12px 0}.chips{position:relative;z-index:2;display:flex;gap:18px;flex-wrap:wrap;margin-top:26px}.chip{padding:15px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.22);background:#142d49;font-size:clamp(19px,2vw,30px);font-weight:900}.goldChip{border-color:#e6b64b;color:#ffe4a5}.redChip{border-color:#ef5961;color:#ffb8bc}
.grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.card{background:#0d2035;border:1px solid #31506f;border-radius:18px;padding:24px 28px;font-size:clamp(22px,2.4vw,38px);font-weight:850}.card b{color:#e6b64b}
.racerWrap{position:relative;z-index:2;display:grid;grid-template-columns:minmax(360px,.46fr) 1fr;gap:44px;align-items:center}.racerPhoto{aspect-ratio:5/4;border-radius:22px;background:radial-gradient(circle,#20334d,#0a1727);border:3px solid #e6b64b;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#90a6ba;font-size:28px;font-weight:900;text-align:center;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.38)}.racerPhoto img{width:100%;height:100%;object-fit:cover}.carName{font-size:clamp(52px,6.8vw,108px);line-height:.92;font-weight:1000;text-transform:uppercase;color:#e6b64b;overflow-wrap:anywhere}.racerName{margin-top:20px;font-size:clamp(30px,3.8vw,60px);line-height:1;font-weight:950}.division{margin-top:24px;font-size:clamp(18px,2vw,30px);letter-spacing:.12em;font-weight:900;color:#a9bdd0;text-transform:uppercase}
.footer{position:absolute;left:28px;right:28px;bottom:15px;z-index:4;display:flex;justify-content:space-between;align-items:center;color:#8799aa;font-size:15px;font-weight:700}.bar{position:absolute;bottom:0;left:0;height:6px;background:#e6b64b;width:0;animation:progress 7s linear forwards}@keyframes progress{to{width:100%}}.flash{animation:enter .5s ease-out}@keyframes enter{from{opacity:0;transform:scale(.975) translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:900px){.frame{padding:42px 34px}.grid,.racerWrap{grid-template-columns:1fr}.racerWrap{gap:20px}.racerPhoto{max-height:330px}.carName{font-size:56px}}
</style>
</head>
<body>
<div class="stage"><div class="checkers top"></div><div class="checkers bottom"></div><div class="speed s1"></div><div class="speed s2"></div><div class="speed s3"></div><div class="speed s4"></div><div class="frame flash" id="frame"></div><div class="footer"><span>MNLT PINEWOOD DERBY • TRADITIONAL DIVISION</span><span id="counter"></span></div><div class="bar" id="bar"></div></div>
<script>
'use strict';
const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos',DURATION=7000;
let state=null,slides=[],index=0,timer=null,objectUrl=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}if(!state)state={registrations:[]}}
function openDb(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getPhoto(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
function welcome(){return `<div class="eyebrow">Start Your Engines</div><div class="title">WELCOME TO THE<br><span class="gold">MNLT PINEWOOD DERBY</span></div><div class="sub">Fast cars • Big cheers • One awesome race day</div><div class="chips"><span class="chip goldChip">TRADITIONAL DIVISION</span><span class="chip">RACING BEGINS SOON</span></div>`}
function bigScreen(){return `<div class="eyebrow">Race Day Display</div><div class="title">WATCH THE<br><span class="gold">BIG SCREEN</span></div><div class="bigline">Your car's race card and lane will appear before each heat.</div><div class="chips"><span class="chip goldChip">CAR NAME</span><span class="chip goldChip">RACER</span><span class="chip goldChip">LANE</span></div>`}
function howItWorks(){return `<div class="eyebrow">How The Race Works</div><div class="title">4 ROUNDS.<br><span class="gold">4 LANES.</span></div><div class="grid"><div class="card"><b>4 races</b><br>for every racer</div><div class="card"><b>Each lane</b><br>exactly once</div><div class="card"><b>Lowest points</b><br>wins the race</div><div class="card"><b>Trophy tie?</b><br>Runoff on the track</div></div>`}
function sportsmanship(){return `<div class="eyebrow">The Most Important Rule</div><div class="title">CHEER <span class="gold">LOUD.</span><br>RACE <span class="red">RIGHT.</span></div><div class="grid"><div class="card">Cheer for <b>every racer</b></div><div class="card">Respect the <b>cars & track</b></div><div class="card">Win with <b>humility</b></div><div class="card">Have a <b>blast</b></div></div>`}
function staging(){return `<div class="eyebrow">Racer Reminder</div><div class="title">STAY <span class="red">READY.</span></div><div class="bigline">Watch for your <span style="color:#e6b64b">CAR NAME</span> and <span style="color:#e6b64b">LANE</span> on the projector.</div><div class="sub">Keep your car close until it is time to stage.</div><div class="chips"><span class="chip goldChip">DO NOT TOUCH CARS ON THE TRACK</span></div>`}
function trophy(){return `<div class="eyebrow">The Track Will Decide</div><div class="title">WHO TAKES<br><span class="gold">THE TROPHY?</span></div><div class="sub">Four rounds stand between the racers and the podium.</div>`}
function racerSlide(reg){const car=(reg.tradCar||'Car Name Coming Soon').trim()||'Car Name Coming Soon';return {kind:'racer',reg,html:`<div class="racerWrap"><div class="racerPhoto" id="racerPhoto">${esc(car)}</div><div><div class="eyebrow">Meet The Cars</div><div class="carName">${esc(car)}</div><div class="racerName">Racer: ${esc(reg.name||'')}</div><div class="division">Traditional Division</div></div></div>`}}
function build(){load();const all=(state.registrations||[]).filter(r=>r.status!=='Withdrawn'&&(r.division==='Traditional'||r.division==='Both'));const approved=all.filter(r=>r.tradInspection&&r.tradInspection.approved);const racers=(approved.length?approved:all).slice().sort((a,b)=>(a.tradNo||9999)-(b.tradNo||9999)||String(a.name).localeCompare(String(b.name)));slides=[{html:welcome()},{html:bigScreen()},{html:howItWorks()}];racers.forEach((r,i)=>{slides.push(racerSlide(r));if(i===Math.floor(racers.length/2)-1)slides.push({html:sportsmanship()})});if(!racers.length)slides.push({html:sportsmanship()});slides.push({html:trophy()},{html:staging()})}
async function render(){if(!slides.length)build();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}const slide=slides[index%slides.length],frame=document.getElementById('frame');frame.classList.remove('flash');void frame.offsetWidth;frame.classList.add('flash');frame.innerHTML=slide.html;document.getElementById('counter').textContent=`SLIDE ${(index%slides.length)+1} / ${slides.length}`;const old=document.getElementById('bar'),bar=old.cloneNode(false);old.replaceWith(bar);if(slide.kind==='racer'){const blob=await getPhoto(`trad:${slide.reg.id}`).catch(()=>null);if(blob&&document.getElementById('racerPhoto')){objectUrl=URL.createObjectURL(blob);document.getElementById('racerPhoto').innerHTML=`<img src="${objectUrl}" alt="${esc(slide.reg.tradCar||'Car')}">`}}}
function next(){index=(index+1)%slides.length;render()}
function prev(){index=(index-1+slides.length)%slides.length;render()}
function restart(){clearInterval(timer);timer=setInterval(next,DURATION)}
function rebuild(){build();index=0;render();restart()}
build();render();restart();
window.addEventListener('storage',e=>{if(e.key===KEY)rebuild()});
try{const bc=new BroadcastChannel('mnltDerbyV2Channel');bc.onmessage=rebuild}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){next();restart()}else if(e.key==='ArrowLeft'){prev();restart()}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});
document.addEventListener('click',()=>{next();restart()});
</script>
</body>
</html>
