<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Bridge Key Update</title>
<style>
body{margin:0;background:#0b1a2a;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:720px;margin:50px auto;padding:24px}
.card{background:#13283e;border:1px solid #35516c;border-radius:14px;padding:24px}
h1{margin:0 0 8px;font-size:30px}p{color:#b8c7d7;line-height:1.5}
label{display:block;font-weight:800;margin-top:18px}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #4a6682;background:#0d1b2b;color:#fff;font-size:15px;margin-top:7px}
button{width:100%;border:0;border-radius:9px;padding:15px 18px;font-size:17px;font-weight:800;cursor:pointer;background:#d8a63d;color:#111820;margin-top:18px}
.status{margin:16px 0;padding:12px;border-radius:9px;background:#173c29;color:#a8efbc;font-weight:700}
.status.bad{background:#3a2025;color:#ffb0b7}
.small{font-size:13px;color:#93a8bc;margin-top:12px}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>MNLT Derby Bridge Key Update</h1>
<p>This updates only the saved Bridge Key used by Registration v5. Your existing Web App URL stays unchanged.</p>
<div id="status" class="status">Checking saved connection…</div>
<label>New Bridge Key</label>
<input id="key" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the new key from Apps Script">
<button id="save">SAVE NEW BRIDGE KEY</button>
<div class="small">After saving, go back to Registration v5, refresh, and test Create Gmail Draft + Attach PDF.</div>
</div></div>
<script>
const CFG='mnltDerbyRegistrationBridgeV1';
let cfg=null;try{cfg=JSON.parse(localStorage.getItem(CFG)||'null')}catch(e){}
const status=document.getElementById('status');
if(cfg&&cfg.url){status.textContent='Existing Web App URL found. Ready for the new key.'}
else{status.textContent='No saved Web App URL found. Stop here and return to ChatGPT.';status.classList.add('bad')}
document.getElementById('save').onclick=()=>{
 const key=document.getElementById('key').value.trim();
 if(!cfg||!cfg.url){alert('No saved Web App URL was found.');return}
 if(key.length<40){alert('That key looks too short. Copy the full new key from the Apps Script execution log.');return}
 cfg.key=key;
 localStorage.setItem(CFG,JSON.stringify(cfg));
 status.textContent='NEW BRIDGE KEY SAVED. Go back to Registration v5 and refresh.';
 status.classList.remove('bad');
 document.getElementById('key').value='';
};
</script>
</body></html>
