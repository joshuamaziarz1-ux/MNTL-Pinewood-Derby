<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Pinewood Derby Pre-Race • 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:Arial,Helvetica,sans-serif}.stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#173254 0,#0a1b2e 45%,#050b12 100%)}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 28px);pointer-events:none}.speed{position:absolute;height:4px;background:linear-gradient(90deg,transparent,#e6b64b,transparent);transform:skewX(-30deg);opacity:.45;animation:fly 3.5s linear infinite}.s1{width:45vw;top:18%;left:-50vw}.s2{width:34vw;top:32%;left:-42vw;animation-delay:.8s}.s3{width:52vw;bottom:24%;left:-58vw;animation-delay:1.7s}.s4{width:26vw;bottom:38%;left:-35vw;animation-delay:2.4s}@keyframes fly{to{left:115vw}}.checkers{position:absolute;left:0;right:0;height:54px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0/54px 54px;opacity:.12}.checkers.top{top:0}.checkers.bottom{bottom:0}.frame{position:relative;z-index:2;width:min(92vw,1450px);height:min(82vh,850px);border:2px solid rgba(230,182,75,.7);border-radius:26px;background:linear-gradient(145deg,rgba(16,37,61,.97),rgba(6,16,28,.97));box-shadow:0 28px 80px rgba(0,0,0,.55),inset 0 0 70px rgba(230,182,75,.04);overflow:hidden;padding:58px 68px;display:flex;flex-direction:column;justify-content:center}.frame:before{content:"";position:absolute;top:-100px;right:-120px;width:440px;height:250px;background:#c93842;transform:rotate(-16deg);opacity:.16}.frame:after{content:"";position:absolute;bottom:-130px;left:-90px;width:520px;height:240px;background:#e6b64b;transform:rotate(12deg);opacity:.10}.eyebrow{position:relative;z-index:2;font-size:clamp(18px,2vw,30px);font-weight:900;letter-spacing:.18em;color:#e6b64b;text-transform:uppercase}.title{position:relative;z-index:2;margin:12px 0 10px;font-size:clamp(54px,7vw,112px);line-height:.92;font-weight:1000;letter-spacing:-.045em;text-transform:uppercase;text-shadow:0 8px 28px rgba(0,0,0,.45)}.title .gold{color:#e6b64b}.title .red{color:#ef5961}.sub{position:relative;z-index:2;margin-top:14px;font-size:clamp(24px,3vw,46px);font-weight:800;color:#dce7f1}.bigline{position:relative;z-index:2;font-size:clamp(32px,4vw,62px);line-height:1.35;font-weight:900;margin:12px 0}.chips{position:relative;z-index:2;display:flex;gap:18px;flex-wrap:wrap;margin-top:26px}.chip{padding:15px 22px;border-radius:999px;border:2px solid rgba(255,255,255,.22);background:#142d49;font-size:clamp(19px,2vw,30px);font-weight:900}.goldChip{border-color:#e6b64b;color:#ffe4a5}.grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.card{background:#0d2035;border:1px solid #31506f;border-radius:18px;padding:24px 28px;font-size:clamp(22px,2.4vw,38px);font-weight:850}.card b{color:#e6b64b}.carFeature{position:relative;z-index:2;display:grid;grid-template-columns:minmax(360px,.9fr) 1.1fr;gap:46px;align-items:center}.carPhoto{aspect-ratio:4/3;border:3px solid #e6b64b;border-radius:22px;overflow:hidden;background:radial-gradient(circle,#20334d,#0b1522);display:flex;align-items:center;justify-content:center;box-shadow:0 22px 50px #0008}.carPhoto img{width:100%;height:100%;object-fit:cover}.noPhoto{color:#8296aa;font-size:clamp(20px,2vw,30px);font-weight:900;text-align:center;padding:30px}.carName{font-size:clamp(58px,7vw,112px);line-height:.92;font-weight:1000;color:#e6b64b;text-transform:uppercase;overflow-wrap:anywhere}.racerName{margin-top:22px;font-size:clamp(30px,3.2vw,52px);line-height:1;font-weight:900}.division{margin-top:22px;font-size:clamp(18px,2vw,30px);letter-spacing:.12em;font-weight:900;color:#a9bdd0;text-transform:uppercase}.funFact{position:relative;z-index:2;font-size:clamp(38px,5vw,76px);line-height:1.18;font-weight:950;max-width:1100px}.funFact small{display:block;margin-bottom:18px;font-size:clamp(20px,2vw,30px);letter-spacing:.18em;color:#e6b64b}.footer{position:absolute;left:28px;right:28px;bottom:15px;z-index:4;display:flex;justify-content:space-between;align-items:center;color:#8799aa;font-size:15px;font-weight:700}.bar{position:absolute;bottom:0;left:0;height:6px;background:#e6b64b;width:0;animation:progress 6.5s linear forwards}@keyframes progress{to{width:100%}}.flash{animation:enter .55s ease-out}@keyframes enter{from{opacity:0;transform:scale(.97) translateY(14px)}to{opacity:1;transform:none}}@media(max-width:900px){.frame{padding:42px 34px}.grid,.carFeature{grid-template-columns:1fr}.carPhoto{max-height:38vh}.carFeature{gap:22px}.carName{font-size:clamp(42px,8vw,78px)}}
</style>
</head>
<body>
<div class="stage"><div class="checkers top"></div><div class="checkers bottom"></div><div class="speed s1"></div><div class="speed s2"></div><div class="speed s3"></div><div class="speed s4"></div><div class="frame flash" id="frame"></div><div class="footer"><span>MNLT PINEWOOD DERBY • TRADITIONAL DIVISION</span><span id="counter"></span></div><div class="bar" id="bar"></div></div>
<script>
'use strict';
const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos',DURATION=6500;
let state=null,slides=[],index=0,timer=null,renderToken=0,activeUrl=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){state=null}if(!state)state={registrations:[]}}
function regs(){return (state.registrations||[]).filter(r=>r.status!=='Withdrawn'&&(r.division==='Traditional'||r.division==='Both')).sort((a,b)=>String(a.tradCar||a.name||'').localeCompare(String(b.tradCar||b.name||'')))}
function openDb(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getPhoto(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
function welcome(){return {html:`<div class="eyebrow">Start Your Engines</div><div class="title">WELCOME TO THE<br><span class="gold">MNLT PINEWOOD DERBY</span></div><div class="sub">Fast cars • Big cheers • One awesome race day</div><div class="chips"><span class="chip goldChip">TRADITIONAL DIVISION</span><span class="chip">RACING BEGINS SOON</span></div>`}}
function getReady(){return {html:`<div class="eyebrow">Almost Time</div><div class="title">GET <span class="red">READY</span><br>TO RACE</div><div class="sub">Cars checked in. Racers ready. Crowd ready.</div><div class="chips"><span class="chip goldChip">WATCH THE PROJECTOR FOR YOUR CAR & LANE</span></div>`}}
function howItWorks(){return {html:`<div class="eyebrow">How The Race Works</div><div class="title">4 ROUNDS.<br><span class="gold">4 LANES.</span></div><div class="grid"><div class="card"><b>4 races</b><br>for every car</div><div class="card"><b>Each lane</b><br>exactly once</div><div class="card"><b>Lowest points</b><br>wins the race</div><div class="card"><b>Trophy tie?</b><br>Runoff on the track</div></div>`}}
function everyLane(){return {html:`<div class="eyebrow">Built For A Great Race</div><div class="title">EVERY CAR.<br><span class="gold">EVERY LANE.</span></div><div class="bigline">Every car gets a run in every lane.</div><div class="sub">If a trophy position is tied, we settle it on the track.</div>`}}
function sportsmanship(){return {html:`<div class="eyebrow">The Most Important Rule</div><div class="title">CHEER <span class="gold">LOUD.</span><br>RACE <span class="red">RIGHT.</span></div><div class="grid"><div class="card">Cheer for <b>every racer</b></div><div class="card">Respect the <b>cars & track</b></div><div class="card">Win with <b>humility</b></div><div class="card">Have a <b>blast</b></div></div>`}}
function trophyHype(){return {html:`<div class="eyebrow">The Track Will Decide</div><div class="title">WHO TAKES<br><span class="gold">THE TROPHY?</span></div><div class="sub">Four rounds stand between the cars and the podium.</div>`}}
function staging(){return {html:`<div class="eyebrow">Racer Reminder</div><div class="title">WATCH THE <span class="gold">PROJECTOR.</span></div><div class="bigline">When your car appears, check the lane and get ready to race.</div><div class="chips"><span class="chip goldChip">KEEP YOUR CAR CLOSE</span></div>`}}
function fact(text){return {html:`<div class="funFact"><small>DID YOU KNOW?</small>${text}</div>`}}
function carSlide(r){return {racer:r}}
function build(){load();const racers=regs(),facts=['Gravity is the engine. Everything else is preparation.','Smooth wheels and straight alignment can make a big difference.','Smart weight placement can change how a car carries speed down the track.','Every lane can behave a little differently — that is why every car rotates lanes.'];slides=[welcome(),getReady(),howItWorks()];if(!racers.length){slides.push(everyLane(),sportsmanship(),fact(facts[0]),trophyHype(),staging());return}let fi=0;racers.forEach((r,i)=>{slides.push(carSlide(r));if(i===2)slides.push(everyLane());else if(i===5)slides.push(sportsmanship());else if(i>0&&i%4===0)slides.push(fact(facts[fi++%facts.length]))});slides.push(trophyHype(),staging(),fact(facts[fi%facts.length]))}
async function render(){if(!slides.length)build();const token=++renderToken,slide=slides[index%slides.length],frame=document.getElementById('frame');if(activeUrl){URL.revokeObjectURL(activeUrl);activeUrl=null}frame.classList.remove('flash');void frame.offsetWidth;frame.classList.add('flash');if(slide.racer){const r=slide.racer,car=r.tradCar||'Car Name Coming Soon';let photo='<div class="noPhoto">CAR PHOTO</div>';try{const blob=await getPhoto(`trad:${r.id}`);if(blob){activeUrl=URL.createObjectURL(blob);photo=`<img src="${activeUrl}" alt="${esc(car)}">`}}catch(e){}if(token!==renderToken)return;frame.innerHTML=`<div class="carFeature"><div class="carPhoto">${photo}</div><div><div class="eyebrow">Meet The Cars</div><div class="carName">${esc(car)}</div><div class="racerName">Racer: ${esc(r.name)}</div><div class="division">Traditional Division</div></div></div>`}else frame.innerHTML=slide.html;document.getElementById('counter').textContent=`SLIDE ${(index%slides.length)+1} / ${slides.length}`;const old=document.getElementById('bar'),bar=old.cloneNode(false);old.replaceWith(bar)}
function next(){index=(index+1)%slides.length;render()}
function prev(){index=(index-1+slides.length)%slides.length;render()}
function restart(){clearInterval(timer);timer=setInterval(next,DURATION)}
build();render();restart();
window.addEventListener('storage',e=>{if(e.key===KEY){build();index=0;render();restart()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){next();restart()}else if(e.key==='ArrowLeft'){prev();restart()}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});
document.addEventListener('click',()=>{next();restart()});
</script>
</body>
</html>
