<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNLT Derby Manager v16</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1522;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block;background:#0b1522}
</style>
</head>
<body>
<iframe id="shell" title="MNLT Derby Manager v16" src="v15.html?v=16-1257"></iframe>
<script>
(function(){
'use strict';
const shell=document.getElementById('shell');

function deepestAppWin(){
  try{
    let w=shell.contentWindow;
    for(let i=0;i<6;i++){
      const d=w.document;
      const f=d.querySelector('iframe');
      if(!f||!f.contentWindow)break;
      w=f.contentWindow;
    }
    return w;
  }catch(e){return null}
}

function patchOpeningHeat(){
  const w=deepestAppWin();
  if(!w||typeof w.buildFairSchedule!=='function')return;
  if(w.__mnltV16OpeningHeatPatched)return;

  const original=w.buildFairSchedule;
  w.buildFairSchedule=function(ids){
    const heats=original(ids);
    if(!Array.isArray(heats)||!Array.isArray(ids)||ids.length<4||!heats.length)return heats;

    const round1Indexes=[];
    for(let i=0;i<heats.length;i++)if(heats[i]&&heats[i].round===1)round1Indexes.push(i);
    if(!round1Indexes.length)return heats;

    const firstIndex=round1Indexes[0];
    const first=heats[firstIndex];
    const activeCount=h=>h&&Array.isArray(h.lanes)?h.lanes.filter(Boolean).length:0;

    // Best case: simply move an already-full Round 1 heat to the opening slot.
    // This changes only the order, so all lane and fairness calculations remain intact.
    const fullIndex=round1Indexes.find(i=>activeCount(heats[i])===4);
    if(fullIndex!==undefined&&fullIndex!==firstIndex){
      const tmp=heats[firstIndex];
      heats[firstIndex]=heats[fullIndex];
      heats[fullIndex]=tmp;
    }

    // Edge-case fallback: if this racer count produced no full heat at all,
    // fill the opening heat by moving same-lane racers from later Round 1 heats.
    // Each racer stays in the same lane and still races once in the round.
    const opening=heats[firstIndex];
    if(activeCount(opening)<4){
      for(let lane=0;lane<4;lane++){
        if(opening.lanes[lane])continue;
        const donorIndex=round1Indexes.slice(1).find(i=>heats[i].lanes&&heats[i].lanes[lane]);
        if(donorIndex!==undefined){
          opening.lanes[lane]=heats[donorIndex].lanes[lane];
          heats[donorIndex].lanes[lane]=null;
        }
      }
    }

    // Heat IDs follow the new running order.
    heats.forEach((h,i)=>{h.id=i+1});
    return heats;
  };
  w.__mnltV16OpeningHeatPatched=true;
}

function markVersion(){
  try{
    const w=deepestAppWin();
    if(!w)return;
    const d=w.document;
    const v=d.querySelector('.version');
    if(v)v.textContent='v16';
    d.title='MNLT Derby Manager v16';
  }catch(e){}
}

function apply(){patchOpeningHeat();markVersion()}
shell.addEventListener('load',()=>{setTimeout(apply,250);setTimeout(apply,900)});
setInterval(apply,500);
})();
</script>
</body>
</html>
