name: Build MNLT Derby Manager v43 Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_v43/**'
      - '.github/workflows/v43-desktop.yml'

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_v43
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile launcher.py app.py storage.py backup.py race_engine.py migration.py

      - name: Race and persistence stress tests
        run: pytest -q

      - name: Build standalone Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MNLT_Derby_Manager_v43 launcher.py

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: MNLT-Derby-Manager-v43-Windows
          path: desktop_v43/dist/MNLT_Derby_Manager_v43.exe
          if-no-files-found: error
