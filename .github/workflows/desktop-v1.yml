name: Build MNLT Derby Manager Desktop v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_v1/**'
      - '.github/workflows/desktop-v1.yml'

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile launcher.py app.py storage.py backup.py race_engine.py migration.py gmail_bridge.py desktop_fixes.py

      - name: Race, persistence, and bridge tests
        run: pytest -q

      - name: Build standalone Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MNLT_Derby_Manager_Desktop_v1 launcher.py

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: MNLT-Derby-Manager-Desktop-v1-Windows
          path: desktop_v1/dist/MNLT_Derby_Manager_Desktop_v1.exe
          if-no-files-found: error
