name: Build MNLT Derby Manager Desktop v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_v1/**'
      - '.github/workflows/desktop-v1.yml'

permissions:
  contents: write

concurrency:
  group: desktop-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop_v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile launcher.py app.py storage.py backup.py race_engine.py migration.py gmail_bridge.py qt_bridge.py desktop_fixes.py updater.py

      - name: Race, persistence, bridge, and updater tests
        run: pytest -q

      - name: Build race manager app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MNLT_Derby_Manager_App launcher.py

      - name: Build permanent updater launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MNLT_Derby_Manager updater.py

      - name: Create signed-hash update manifest
        shell: pwsh
        run: |
          $app = "dist/MNLT_Derby_Manager_App.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $app).Hash.ToLower()
          $manifest = [ordered]@{
            channel = "desktop-v1"
            version = "Desktop v1"
            build = "${{ github.sha }}"
            min_updater = 1
            asset_url = "https://github.com/joshuamaziarz1-ux/MNTL-Pinewood-Derby/releases/download/desktop-v1-latest/MNLT_Derby_Manager_App.exe"
            sha256 = $sha
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 desktop-v1-manifest.json

      - name: Publish Desktop v1 latest app
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "joshuamaziarz1-ux/MNTL-Pinewood-Derby"
          $tag = "desktop-v1-latest"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "MNLT Derby Manager Desktop v1 - Latest" --notes "Automatic-update channel for Desktop v1."
          }

          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          foreach ($name in @("MNLT_Derby_Manager_App.exe", "desktop-v1-manifest.json")) {
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($asset) {
              gh api -X DELETE "repos/$repo/releases/assets/$($asset.id)"
            }
          }

          gh release upload $tag dist/MNLT_Derby_Manager_App.exe --repo $repo
          gh release upload $tag desktop-v1-manifest.json --repo $repo

      - name: Upload permanent updater
        uses: actions/upload-artifact@v4
        with:
          name: MNLT-Derby-Manager-Permanent-Updater
          path: desktop_v1/dist/MNLT_Derby_Manager.exe
          if-no-files-found: error

      - name: Upload current race manager app
        uses: actions/upload-artifact@v4
        with:
          name: MNLT-Derby-Manager-Desktop-v1-App
          path: desktop_v1/dist/MNLT_Derby_Manager_App.exe
          if-no-files-found: error
