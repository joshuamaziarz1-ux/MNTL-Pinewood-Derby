<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111d">
<title>MNLT Pinewood Derby • Audience Projector v41</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07111d;--panel:#101d2d;--panel2:#13243a;--line:#29415c;--text:#f7f9fc;--muted:#9eb0c2;--gold:#d8a63d;--gold2:#f2ca69;--silver:#d9e0e7;--bronze:#d59a6a;--blue:#76b8de;--green:#9ee7af}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at 50% 5%,#142b48 0,#0a1726 43%,#07111d 100%)}
#screen{height:100vh;padding:22px 28px 18px;display:flex;flex-direction:column}
.top{text-align:center;flex:0 0 auto}.eyebrow{font-size:clamp(14px,1.15vw,20px);font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.headline{font-size:clamp(34px,4vw,66px);font-weight:1000;line-height:1;margin:5px 0 0}.sub{font-size:clamp(18px,1.6vw,27px);font-weight:900;color:var(--gold2);margin-top:7px}
.cards{flex:1 1 auto;min-height:0;max-width:1700px;width:100%;margin:18px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{min-width:0;min-height:0;background:linear-gradient(160deg,#13243a,#0c1928 68%);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 34px #0007;position:relative}
.card.gold{border-color:var(--gold)}.card.exhibitionCard{border-color:var(--blue)}
.photo{flex:1 1 auto;min-height:0;background:radial-gradient(circle,#20334d,#0b1522);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}.noPhoto{padding:30px;text-align:center;color:#71879c;font-size:clamp(22px,2vw,34px);font-weight:1000}
.badge{position:absolute;top:14px;left:14px;z-index:3;background:var(--gold);color:#111820;border-radius:10px;padding:9px 13px;font-size:clamp(20px,1.8vw,30px);font-weight:1000;box-shadow:0 5px 15px #0008}
.place{position:absolute;top:14px;right:14px;z-index:3;background:#f4f7fb;color:#101820;border-radius:10px;padding:9px 13px;font-size:clamp(23px,2.2vw,36px);font-weight:1000;box-shadow:0 5px 15px #0008}
.info{flex:0 0 auto;padding:15px 18px 17px;border-top:1px solid #253a52}.carName{font-size:clamp(27px,2.45vw,42px);line-height:1.02;font-weight:1000;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.racerName{font-size:clamp(18px,1.55vw,27px);font-weight:900;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.smallMeta{font-size:clamp(12px,1vw,16px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.waiting{flex:1;display:grid;place-items:center;text-align:center}.waitingBox{max-width:1050px}.event{font-size:clamp(28px,3vw,48px);font-weight:1000;color:var(--gold2);letter-spacing:.06em}.waitDivision{font-size:clamp(48px,6vw,94px);font-weight:1000;line-height:.95;margin-top:16px}.waitMessage{font-size:clamp(25px,2.7vw,42px);font-weight:900;color:var(--silver);margin-top:20px}.watch{font-size:clamp(18px,1.6vw,26px);font-weight:800;color:var(--muted);margin-top:18px}
.tieBox{flex:1;display:grid;place-items:center}.tieInner{width:min(1150px,92vw);text-align:center;background:#111e2e;border:2px solid var(--gold);border-radius:22px;padding:34px 42px;box-shadow:0 18px 45px #0008}.tieTitle{font-size:clamp(42px,5vw,78px);font-weight:1000;line-height:1;color:var(--gold2)}.tiePlace{font-size:clamp(24px,2.3vw,36px);font-weight:900;margin-top:12px}.tieCars{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}.tieChip{background:#1b2b3e;border:1px solid #38516d;border-radius:12px;padding:12px 17px;font-size:clamp(20px,1.8vw,29px);font-weight:1000}.tieNote{color:var(--muted);font-size:clamp(16px,1.4vw,22px);font-weight:800;margin-top:20px}
.finalGrid{flex:1 1 auto;min-height:0;max-width:1650px;width:100%;margin:18px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.finalCard{min-width:0;min-height:0;background:linear-gradient(160deg,#13243a,#0c1928 68%);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative}.finalCard.p1{border:3px solid var(--gold)}.finalCard.p2{border-color:#aab8c6}.finalCard.p3{border-color:#b6784c}.finalPlace{text-align:center;padding:10px;font-size:clamp(29px,2.8vw,46px);font-weight:1000;background:#0c1826;border-bottom:1px solid #31475e}.p1 .finalPlace{background:#3a2b0d;color:#ffe18a}.p2 .finalPlace{color:#e5edf4}.p3 .finalPlace{color:#e6ad83}.finalPhoto{flex:1;min-height:0;background:#0b1522;display:flex;align-items:center;justify-content:center;overflow:hidden}.finalPhoto img{width:100%;height:100%;object-fit:cover}.finalInfo{padding:14px 17px 16px}.finalCar{font-size:clamp(25px,2.25vw,38px);font-weight:1000;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finalRacer{font-size:clamp(17px,1.45vw,24px);font-weight:900;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exOnly{color:#b9e6ff}.tiny{position:fixed;right:8px;bottom:6px;font-size:11px;color:#526a81;font-weight:800}.accent{position:fixed;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#8d6b25,#d8a63d,#f2ca69,#d8a63d,#8d6b25)}
@media(max-width:1050px){#screen{padding:14px}.cards,.finalGrid{grid-template-columns:1fr 1fr;gap:12px}.headline{font-size:42px}.card,.finalCard{min-height:0}.info{padding:11px 14px}.carName{font-size:28px}.racerName{font-size:20px}}
</style>
</head>
<body>
<div id="screen"></div><div class="tiny">MNLT Pinewood Derby • v41</div><div class="accent"></div>
<script>
'use strict';
const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos',RESULT_MS=6500,UP_NEXT_MS=5000,TROPHY_PLACES=4;
let S=null,renderToken=0,urls=[],sequenceTimer=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ordinal(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH'}
function deep(v){try{return JSON.parse(JSON.stringify(v))}catch(e){return null}}
function readState(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!x||typeof x!=='object')x={};if(!Array.isArray(x.registrations))x.registrations=[];if(!Array.isArray(x.racers))x.racers=[];if(!Array.isArray(x.heats))x.heats=[];if(!x.modified||typeof x.modified!=='object')x.modified={};if(!Array.isArray(x.modified.raceRacers))x.modified.raceRacers=[];if(!Array.isArray(x.modified.heats))x.modified.heats=[];if(!x.modified.exhibition)x.modified.exhibition={active:false};return x}
function clearTimers(){if(sequenceTimer){clearTimeout(sequenceTimer);sequenceTimer=null}}
function clearUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}
function openDb(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getPhoto(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
function isModifiedState(st){return String(st?.raceType||'Traditional').toLowerCase()==='modified'}
function context(st){const modified=isModifiedState(st);if(modified&&st.modified?.exhibition?.active){const reg=st.registrations.find(r=>r.id===st.modified.exhibition.registrationId)||null;return{mode:'exhibition',modified,reg,lane:Number(st.modified.exhibition.lane)||2}}
 const ro=modified?(st.modified?.runoff&&st.modified.runoff.active?st.modified.runoff:null):(st.runoff&&st.runoff.active?st.runoff:null),heats=ro?ro.heats:(modified?st.modified.heats:st.heats),current=ro?ro.current:(modified?st.modified.current:st.current),racers=modified?(st.modified.raceRacers||[]):(st.racers||[]);
 return{mode:'race',modified,ro,heats:Array.isArray(heats)?heats:[],current:Number(current)||0,racers};}
function divisionName(modified){return modified?'MODIFIED DIVISION':'TRADITIONAL DIVISION'}
function racerById(st,modified,id){const arr=modified?(st.modified?.raceRacers||[]):(st.racers||[]);return arr.find(r=>String(r.id)===String(id))||null}
function registrationFor(st,modified,racer){if(!racer)return null;return st.registrations.find(x=>String(x.id)===String(racer.registrationId)||(modified?String(x.modRacerId)===String(racer.id):String(x.tradRacerId)===String(racer.id)))||null}
function carFor(st,modified,racer){const reg=registrationFor(st,modified,racer),v=(reg&&(modified?reg.modCar:reg.tradCar))||racer?.car||'Unnamed Car';return String(v).trim()||'Unnamed Car'}
function photoKey(modified,reg){return reg?`${modified?'mod':'trad'}:${reg.id}`:null}
function heatDone(h){const active=(h?.lanes||[]).filter(Boolean).length;return active>0&&Array.isArray(h?.results)&&h.results.length===active}
function allDone(heats){return Array.isArray(heats)&&heats.length>0&&heats.every(heatDone)}
function samePts(a,b){return Math.abs(Number(a)-Number(b))<1e-9}
function rawStandings(st,modified){const racers=modified?(st.modified?.raceRacers||[]):(st.racers||[]),heats=modified?(st.modified?.heats||[]):(st.heats||[]),map=new Map(racers.map(r=>[String(r.id),{id:r.id,name:r.name,number:r.number,points:0,races:0}]));heats.forEach(h=>(h.results||[]).forEach(x=>{const q=map.get(String(x.racerId));if(q){q.points+=Number(x.points)||0;q.races++}}));return[...map.values()].sort((a,b)=>a.points-b.points||(Number(a.number)||0)-(Number(b.number)||0))}
function tieKey(group){return`${group.map(r=>String(r.id)).sort().join(',')}@${group.length?Number(group[0].points).toFixed(6):'0'}`}
function tieStore(st,modified){return modified?(st.modified?.tieBreaks||{}):(st.tieBreaks||{})}
function resolvedTie(st,modified,group){const t=tieStore(st,modified)[tieKey(group)];if(!t||!Array.isArray(t.order)||t.order.length!==group.length)return null;const need=new Set(group.map(r=>String(r.id))),got=new Set(t.order.map(String));return need.size===got.size&&[...need].every(x=>got.has(x))?t:null}
function finalStandings(st,modified){const a=rawStandings(st,modified);for(let i=0;i<a.length;){let j=i+1;while(j<a.length&&samePts(a[j].points,a[i].points))j++;if(j-i>1){const group=a.slice(i,j),t=resolvedTie(st,modified,group);if(t){const pos=new Map(t.order.map((id,k)=>[String(id),k]));a.splice(i,j-i,...group.sort((x,y)=>pos.get(String(x.id))-pos.get(String(y.id))))}}i=j}return a}
function pendingTrophyTie(st,modified){const a=rawStandings(st,modified);for(let i=0;i<a.length;){let j=i+1;while(j<a.length&&samePts(a[j].points,a[i].points))j++;if(j-i>1&&i<TROPHY_PLACES){const group=a.slice(i,j);if(!resolvedTie(st,modified,group))return{start:i,end:j-1,racers:group}}i=j}return null}
function placeRange(g){const a=g.start+1,b=g.end+1;return a===b?ordinal(a):`${ordinal(a)}–${ordinal(b)}`}
async function putPhotoInto(host,key,alt,token){if(!key)return;const blob=await getPhoto(key).catch(()=>null);if(blob&&token===renderToken&&host?.isConnected){const u=URL.createObjectURL(blob);urls.push(u);host.innerHTML=`<img src="${u}" alt="${esc(alt)}">`}}
function headerHtml(eyebrow,headline,sub=''){return`<div class="top"><div class="eyebrow">${esc(eyebrow)}</div><div class="headline">${esc(headline)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>`}
async function renderCards(st,modified,heat,mode,total,ro){const token=++renderToken;clearUrls();const saved=mode==='results',resultMap=new Map((heat.results||[]).map(x=>[String(x.racerId),x.position])),entries=(heat.lanes||[]).map((id,i)=>({id,lane:i+1,position:id?resultMap.get(String(id)):null})).filter(x=>x.id);if(saved)entries.sort((a,b)=>(a.position||99)-(b.position||99));const div=divisionName(modified),eyebrow=ro?`${div} • TROPHY RUNOFF`:div,headline=mode==='results'?'HEAT RESULTS':mode==='upnext'?'UP NEXT':'NOW RACING',sub=`${ro?`SET ${ro.attempt} • `:''}HEAT ${heat.id} OF ${total}${ro?` • ${ordinal(ro.placeStart)}${ro.placeEnd!==ro.placeStart?'–'+ordinal(ro.placeEnd):''} PLACE TIE`:''}`;document.getElementById('screen').innerHTML=headerHtml(eyebrow,headline,sub)+'<div class="cards" id="cards"></div>';const cards=document.getElementById('cards');for(const item of entries){if(token!==renderToken)return;const racer=racerById(st,modified,item.id);if(!racer)continue;const reg=registrationFor(st,modified,racer),car=carFor(st,modified,racer),card=document.createElement('div');card.className='card'+(saved&&item.position===1?' gold':'');card.innerHTML=`<div class="photo"><div class="badge">LANE ${item.lane}</div>${saved?`<div class="place">${ordinal(item.position)}</div>`:''}<div class="noPhoto">${esc(car)}</div></div><div class="info"><div class="carName">${esc(car)}</div><div class="racerName">${esc(racer.name||'')}</div><div class="smallMeta">${saved?'Heat finish':'Watch for your lane'}</div></div>`;cards.appendChild(card);await putPhotoInto(card.querySelector('.photo .noPhoto'),photoKey(modified,reg),car,token)}}
async function renderWaiting(st,modified){++renderToken;clearUrls();document.getElementById('screen').innerHTML=`<div class="waiting"><div class="waitingBox"><div class="event">MNLT PINEWOOD DERBY</div><div class="waitDivision">${divisionName(modified)}</div><div class="waitMessage">RACE STARTING SOON</div><div class="watch">Watch this screen for your car name and lane.</div></div></div>`}
async function renderExhibition(st,ctx){const token=++renderToken;clearUrls();const reg=ctx.reg;if(!reg){return renderWaiting(st,true)}const car=String(reg.modCar||'Unnamed Car').trim()||'Unnamed Car';document.getElementById('screen').innerHTML=headerHtml('MODIFIED DIVISION','EXHIBITION RUN','NOT SCORED • NOT PART OF OFFICIAL STANDINGS')+`<div class="cards" style="grid-template-columns:minmax(340px,560px);justify-content:center"><div class="card exhibitionCard" id="exCard"><div class="photo"><div class="badge" style="background:var(--blue)">LANE ${ctx.lane}</div><div class="noPhoto">${esc(car)}</div></div><div class="info"><div class="carName exOnly">${esc(car)}</div><div class="racerName">${esc(reg.name||'')}</div><div class="smallMeta">Modified Exhibition</div></div></div></div>`;await putPhotoInto(document.querySelector('#exCard .noPhoto'),`mod:${reg.id}`,car,token)}
async function renderTieRequired(st,modified,tie){++renderToken;clearUrls();const chips=tie.racers.map(r=>{const racer=racerById(st,modified,r.id),car=carFor(st,modified,racer||r);return`<div class="tieChip">${esc(car)} <span style="color:var(--muted);font-size:.78em">• ${esc(r.name||racer?.name||'')}</span></div>`}).join('');document.getElementById('screen').innerHTML=headerHtml(divisionName(modified),'TROPHY RUNOFF REQUIRED',`${placeRange(tie)} PLACE TIE`)+`<div class="tieBox"><div class="tieInner"><div class="tieTitle">TIE ON THE TRACK</div><div class="tiePlace">These cars will race again.</div><div class="tieCars">${chips}</div><div class="tieNote">The trophy place will be settled by a verified runoff.</div></div></div>`}
async function renderRunoffStillTied(st,modified,ro){++renderToken;clearUrls();const next=(ro.blocks?.[ro.nextBlockIndex]||ro.currentIds||[]),chips=next.map(id=>{const r=racerById(st,modified,id),car=carFor(st,modified,r);return`<div class="tieChip">${esc(car)} <span style="color:var(--muted);font-size:.78em">• ${esc(r?.name||'')}</span></div>`}).join('');document.getElementById('screen').innerHTML=headerHtml(`${divisionName(modified)} • TROPHY RUNOFF`,'TIE REMAINS',`RUNOFF SET ${ro.attempt} COMPLETE`)+`<div class="tieBox"><div class="tieInner"><div class="tieTitle">RACE AGAIN</div><div class="tiePlace">Only the cars still tied continue.</div><div class="tieCars">${chips}</div><div class="tieNote">Racers already separated keep their finishing order.</div></div></div>`}
async function renderFinal(st,modified){const token=++renderToken;clearUrls();const a=finalStandings(st,modified).slice(0,4);document.getElementById('screen').innerHTML=headerHtml(divisionName(modified),'FINAL RESULTS','MNLT PINEWOOD DERBY')+'<div class="finalGrid" id="finalGrid"></div>';const host=document.getElementById('finalGrid');for(let i=0;i<a.length;i++){if(token!==renderToken)return;const s=a[i],r=racerById(st,modified,s.id),reg=registrationFor(st,modified,r),car=carFor(st,modified,r),card=document.createElement('div');card.className=`finalCard p${i+1}`;card.innerHTML=`<div class="finalPlace">${ordinal(i+1)} PLACE</div><div class="finalPhoto"><div class="noPhoto">${esc(car)}</div></div><div class="finalInfo"><div class="finalCar">${esc(car)}</div><div class="finalRacer">${esc(r?.name||s.name||'')}</div></div>`;host.appendChild(card);await putPhotoInto(card.querySelector('.finalPhoto .noPhoto'),photoKey(modified,reg),car,token)}}
async function renderDefault(){clearTimers();S=readState();const ctx=context(S);if(ctx.mode==='exhibition')return renderExhibition(S,ctx);if(!ctx.heats.length)return renderWaiting(S,ctx.modified);if(ctx.ro?.completed)return renderRunoffStillTied(S,ctx.modified,ctx.ro);if(!ctx.ro&&allDone(ctx.heats)){const tie=pendingTrophyTie(S,ctx.modified);return tie?renderTieRequired(S,ctx.modified,tie):renderFinal(S,ctx.modified)}const idx=Math.max(0,Math.min(ctx.current,ctx.heats.length-1)),h=ctx.heats[idx];if(!h)return renderWaiting(S,ctx.modified);return renderCards(S,ctx.modified,h,heatDone(h)?'results':'racing',ctx.heats.length,ctx.ro)}
function findNewSaved(oldSt,newSt){if(!oldSt||!newSt)return null;const modified=isModifiedState(newSt);const newRo=modified?newSt.modified?.runoff:newSt.runoff,oldRo=modified?oldSt.modified?.runoff:oldSt.runoff;if(newRo?.active&&oldRo?.active){for(const h of newRo.heats||[]){const old=(oldRo.heats||[]).find(x=>String(x.id)===String(h.id));if(heatDone(h)&&!heatDone(old))return{modified,heat:deep(h),total:(newRo.heats||[]).length,ro:deep(newRo)}}}
 const nh=modified?(newSt.modified?.heats||[]):(newSt.heats||[]),oh=modified?(oldSt.modified?.heats||[]):(oldSt.heats||[]);for(const h of nh){const old=oh.find(x=>String(x.id)===String(h.id));if(heatDone(h)&&!heatDone(old))return{modified,heat:deep(h),total:nh.length,ro:null}}return null}
async function playResultSequence(evt){clearTimers();const snap=readState();await renderCards(snap,evt.modified,evt.heat,'results',evt.total,evt.ro);sequenceTimer=setTimeout(async()=>{S=readState();const ctx=context(S);if(ctx.mode==='exhibition')return renderExhibition(S,ctx);if(!ctx.heats.length)return renderWaiting(S,ctx.modified);if(ctx.ro?.completed)return renderRunoffStillTied(S,ctx.modified,ctx.ro);if(!ctx.ro&&allDone(ctx.heats)){const tie=pendingTrophyTie(S,ctx.modified);return tie?renderTieRequired(S,ctx.modified,tie):renderFinal(S,ctx.modified)}const idx=Math.max(0,Math.min(ctx.current,ctx.heats.length-1)),next=ctx.heats[idx];if(!next||heatDone(next))return renderDefault();await renderCards(S,ctx.modified,next,'upnext',ctx.heats.length,ctx.ro);sequenceTimer=setTimeout(renderDefault,UP_NEXT_MS)},RESULT_MS)}
async function handleUpdate(){const old=S?deep(S):null,newSt=readState(),evt=findNewSaved(old,newSt);S=newSt;if(evt)return playResultSequence(evt);return renderDefault()}
window.addEventListener('storage',e=>{if(e.key===KEY)handleUpdate()});try{const bc=new BroadcastChannel('mnltDerbyV2Channel');bc.onmessage=handleUpdate}catch(e){}try{const bc2=new BroadcastChannel('mnltDerbyLive');bc2.onmessage=handleUpdate}catch(e){}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.()});
S=readState();renderDefault();
</script>
</body>
</html>
