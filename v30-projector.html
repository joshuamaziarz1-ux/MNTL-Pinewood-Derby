<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111d">
<title>MNLT Pinewood Derby • Live Projector v30</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 18%,#142b48 0,#0b1522 56%,#07101b 100%);color:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
body{padding:20px}.title{text-align:center;font-size:clamp(38px,4vw,64px);font-weight:1000;margin:4px 0 8px}.status{text-align:center;color:#f0c55d;font-size:clamp(20px,2vw,32px);font-weight:1000;letter-spacing:.08em;margin-bottom:18px}.cards{max-width:1540px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.raceCard{position:relative;min-height:610px;background:linear-gradient(145deg,#101d2d,#0b1522 58%,#18263a);border:3px solid #d8a63d;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px #0008}.photo{height:58%;background:radial-gradient(circle,#20334d,#0b1522);display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.noPhoto{color:#8fa3b8;font-size:26px;font-weight:900;text-align:center;padding:28px}.lane{position:absolute;top:14px;left:14px;z-index:2;background:#d8a63d;color:#111820;font-size:clamp(22px,2.1vw,32px);font-weight:1000;padding:9px 13px;border-radius:10px;box-shadow:0 5px 16px #0007}.place{position:absolute;top:14px;right:14px;z-index:2;background:#f4f7fb;color:#111820;font-size:clamp(20px,1.8vw,28px);font-weight:1000;padding:9px 12px;border-radius:10px;box-shadow:0 5px 16px #0007}.info{padding:18px 20px 22px}.car{font-size:clamp(29px,2.6vw,42px);line-height:1.02;font-weight:1000;color:#f0c55d;overflow-wrap:anywhere}.racer{font-size:clamp(20px,1.8vw,29px);font-weight:900;margin-top:10px}.division{font-size:14px;color:#9dafc1;font-weight:900;letter-spacing:.09em;text-transform:uppercase;margin-top:14px}.waiting{max-width:1000px;margin:12vh auto 0;background:#142338;border:2px dashed #405873;border-radius:18px;padding:70px 30px;text-align:center;color:#9dafc1;font-size:clamp(30px,4vw,54px);font-weight:1000}.footer{position:fixed;right:10px;bottom:7px;color:#60778e;font-size:12px;font-weight:800}.checkers{position:fixed;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#d8a63d 0 28px,#111820 28px 56px);opacity:.7}
@media(max-width:1100px){.cards{grid-template-columns:1fr 1fr}.raceCard{min-height:520px}}@media(max-width:700px){body{padding:10px}.cards{grid-template-columns:1fr}.raceCard{min-height:500px}}
</style>
</head>
<body>
<div id="screen"></div><div class="footer">MNLT Pinewood Derby • Live Display</div><div class="checkers"></div>
<script>
'use strict';
const KEY='mnltDerbyV2',DB='mnltDerbyMedia',STORE='photos';
let S=null,renderToken=0,urls=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}if(!S)S={registrations:[],racers:[],heats:[],current:0};if(!Array.isArray(S.registrations))S.registrations=[];if(!Array.isArray(S.racers))S.racers=[];if(!Array.isArray(S.heats))S.heats=[];if(!Number.isFinite(Number(S.current)))S.current=0}
function racerById(id){return S.racers.find(r=>r.id===id)||null}
function ordinal(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'}
function openDb(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getPhoto(key){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
function clearUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[]}
async function render(){const token=++renderToken;clearUrls();load();const screen=document.getElementById('screen'),h=S.heats[Math.max(0,Math.min(Number(S.current)||0,S.heats.length-1))];if(!h){screen.innerHTML='<div class="title">MNLT Pinewood Derby</div><div class="waiting">Waiting for the next race</div>';return}const saved=Array.isArray(h.results)&&h.results.length>0,resultMap=new Map((h.results||[]).map(x=>[x.racerId,x.position]));const entries=(h.lanes||[]).map((id,i)=>({id,lane:i+1,position:id?resultMap.get(id):null})).filter(x=>x.id);if(saved)entries.sort((a,b)=>(a.position||99)-(b.position||99));screen.innerHTML=`<div class="title">Round ${h.round} • Heat ${h.id}</div><div class="status">${saved?'RESULTS':'RACING NOW'}</div><div class="cards" id="cards"></div>`;const host=document.getElementById('cards');for(const item of entries){if(token!==renderToken)return;const racer=racerById(item.id);if(!racer)continue;const reg=S.registrations.find(x=>x.id===racer.registrationId||x.tradRacerId===racer.id);const car=((reg&&reg.tradCar)||racer.car||'Unnamed Car').trim()||'Unnamed Car';const card=document.createElement('div');card.className='raceCard';card.innerHTML=`<div class="lane">LANE ${item.lane}</div>${saved?`<div class="place">${ordinal(item.position)}</div>`:''}<div class="photo"><div class="noPhoto">${esc(car)}</div></div><div class="info"><div class="car">${esc(car)}</div><div class="racer">${esc(racer.name||'')}</div><div class="division">Traditional Division</div></div>`;host.appendChild(card);if(reg){const blob=await getPhoto(`trad:${reg.id}`).catch(()=>null);if(blob&&token===renderToken){const u=URL.createObjectURL(blob);urls.push(u);const ph=card.querySelector('.photo');ph.innerHTML=`<img src="${u}" alt="${esc(car)}">`}}}}
window.addEventListener('storage',e=>{if(e.key===KEY)render()});
try{const bc=new BroadcastChannel('mnltDerbyV2Channel');bc.onmessage=render}catch(e){}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});
render();
</script>
</body>
</html>
